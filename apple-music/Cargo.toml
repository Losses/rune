[package]
name = "apple-music"
version = "0.1.0"
edition = "2024"
description = "Async client for the Apple Music API (api.music.apple.com)"

[lib]
name = "apple_music"
path = "src/lib.rs"

[features]
test-fixtures = ["dep:axum", "tokio/net", "tokio/rt"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4.22"
rand = "0.10.3"
reqwest = { version = "0.12.18", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2"
tokio = { version = "1.40.0", features = ["sync", "time"] }

[dev-dependencies]
apple-music = { path = ".", features = ["test-fixtures"] }
axum = "0.8.1"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
