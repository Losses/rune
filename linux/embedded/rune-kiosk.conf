# Settings of rune-kiosk.service, installed as /etc/rune-kiosk.conf. The
# installer writes it only when it is missing, so changes here stay when the
# kiosk is installed again.

# Text box cursors blink instead of fading. A fading cursor makes the app draw
# a frame at every vsync while a text box has focus. flutter-pi passes no
# arguments to the app, so the switch comes in this variable (--blink-cursor
# elsewhere). Remove the line for the fading cursor.
RUNE_BLINK_CURSOR=1

# While the kiosk runs, the GPU devfreq device below uses this governor and
# this minimum frequency in Hz. When the kiosk stops, the device gets back the
# governor and minimum it had before. Leave RUNE_GPU_DEVFREQ empty to leave the
# GPU alone, or either of the other two empty to leave that one alone.
#
# The values suit the RK3566/RK3568 (Mali-G52 at fde60000). simple_ondemand
# raises the clock only above about 90 % load; at its 200 MHz floor the GPU
# held music playback at about 52 frames a second, and with a 400 MHz floor it
# keeps 60 at half the clock that the performance governor pins it to.
RUNE_GPU_DEVFREQ=/sys/class/devfreq/fde60000.gpu
RUNE_GPU_GOVERNOR=simple_ondemand
RUNE_GPU_MIN_FREQ=400000000

# While the kiosk runs, no CPU goes above this frequency in kHz. When the kiosk
# stops, every CPU gets back the maximum it had before. Leave it empty to leave
# the CPU alone.
#
# The value suits the RK3566/RK3568: 816 MHz is the fastest step that still
# runs at the lowest CPU voltage (0.85 V; 1.8 GHz needs 1.1 V). The cover wall
# keeps 60 frames a second down to 600 MHz, and no governor settles there by
# itself: ondemand, conservative and schedutil all stay near the top step
# while it animates. With the limit a Radxa ZERO 3 draws about half a watt less
# and runs 7 degrees cooler on the cover wall. Work that fills the CPU, such as
# scanning or analysing a library, takes longer under the limit.
RUNE_CPU_MAX_FREQ=816000

# While the kiosk runs, these controllers are unbound from their drivers, as
# <platform driver>/<device> under /sys/bus/platform/drivers. When the kiosk
# stops, they are bound again. Leave it empty to leave every controller alone.
#
# The list suits the Radxa ZERO 3W: it has no Ethernet port, and nothing is
# wired to the four USB 2 host controllers (the touchscreen is on the USB 3
# host). A controller with a network link up or a USB device plugged in when
# the kiosk starts stays on. Take a controller off the list before plugging
# something into it while the kiosk runs.
RUNE_UNUSED_DEVICES="rk_gmac-dwmac/fe010000.ethernet ehci-platform/fd800000.usb ehci-platform/fd880000.usb ohci-platform/fd840000.usb ohci-platform/fd8c0000.usb"
