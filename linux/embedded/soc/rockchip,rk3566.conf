# Rockchip RK3566, measured on a Radxa ZERO 3W: documents/embedded-power.md.
# Each line sets a value only where /etc/rune-kiosk.conf gives none.

# Mali-G52. simple_ondemand raises the clock only above about 90 % load; at its
# 200 MHz floor the GPU held music playback at about 52 frames a second, and
# with a 400 MHz floor it keeps 60 at half the clock that the performance
# governor pins it to.
: "${RUNE_GPU_DEVFREQ=/sys/class/devfreq/fde60000.gpu}"
: "${RUNE_GPU_GOVERNOR=simple_ondemand}"
: "${RUNE_GPU_MIN_FREQ=400000000}"

# 816 MHz is the fastest step that still runs at the lowest CPU voltage (0.85 V;
# 1.8 GHz needs 1.1 V). The cover wall keeps 60 frames a second down to 600 MHz,
# and no governor settles there by itself: ondemand, conservative and schedutil
# all stay near the top step while it animates. With the limit the board draws
# about half a watt less and runs 7 degrees cooler on the cover wall.
: "${RUNE_CPU_MAX_FREQ=816000}"
