format = 1
name = "Armillary"
license = "MPL-2.0"
description = "An armillary sphere hung in space, its rings strings of dots and crosses hung as pendulums, pushed to swing out and turn over; a planet in character art at its heart, swelling with the music; polygons drawn in lines round it, lit by the accents"

common = ["world.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md): An
# instrument of the night sky: a flash like daybreak, a flare off its lit rings, and all of the lens
# effects.
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "dissolve", "flash"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare", "leak", "glitch", "mosaic"]

# The looks (update.wgsl maps the colours by them and blends them; the runtime picks one at a
# section start by the section's energy): the sphere in grey, a little dim, with a faint tint of
# the theme colour, at quiet and ordinary sections, and in the theme colour at the climax. The
# whole picture is one colour family, as Emoji Tunnel's, CRT Wall's and Neon Street's are.
[[look]]
name = "grey"
tags = ["night"]
tiers = ["quiet", "normal"]

[[look]]
name = "theme colour"
tags = ["colour"]
tiers = ["high"]
opens = false
# A song with no high section would stay grey throughout: it is promised the look once, in its
# highest section then.
at_least_once = true

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel,
# 0.5 a quarter of them.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

# The camera never rolls of its own accord, so the director's dutch angle is what tilts it.
[camera]
dutch = 0.3

# The four setups, in this order (update.wgsl maps `shot.index` to them), each with a character of
# its own. Below is wide, from below and to one side, pushing in. Level is medium: at the middle's
# height, from a side, nearer than below, so the rings are seen nearly edge on and cross as tilted
# lines and narrow ellipses. Through the rings is closer still, among the rings. Above is the top
# view. A far or top view is not for a climax; every kind of section has a shot to open it (quiet:
# below; ordinary and high: below, level).
[[shot]]
name = "below"
size = "wide"
move = "cut"

[[shot]]
name = "level"
size = "medium"
move = "cut"
opens = true
tiers = ["normal", "high"]

[[shot]]
name = "through the rings"
size = "close"
move = "cut"
tiers = ["normal", "high"]

[[shot]]
name = "above"
size = "top"
move = "cut"
tiers = ["quiet", "normal"]

# The burst before a section that lifts, four hard cuts, one a beat (update.wgsl `choose_burst`
# chooses what each frames, at the cut, and keeps it for the cut): along a ring (the next one in the
# lighting order, lit for the cut), a metre outside it, its arc sweeping across the picture round to
# the planet; at a polygon, lit for the cut, seen 30 degrees off its face; down the pole, the rings
# as ellipses round the planet; and last the planet, filling most of the picture, the nearest rings'
# marks passing in front of it. One of them is on the planet and one on a polygon.
[[burst]]
name = "along a ring"
size = "close"

[[burst]]
name = "a shape"
size = "detail"

[[burst]]
name = "down the pole"
size = "top"

[[burst]]
name = "the planet"
size = "close"

# Kept dark: it is watched mostly at night.
[post]
exposure = -0.2
bloom = { intensity = 0.45, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.02
chromatic = 0.0008
vignette = 0.4
contrast = 1.05
saturation = 1.1


# ---- What the music drives ----
# The scene says what it wants from the music and the runtime works it out (see "Bindings" in the
# runtime's docs/music.md); the shaders read the values as `input.<id>`. The moments (a beat, a bar
# line, a section) arrive as one-frame pulses; the paces that sum into the ecliptic's precession,
# the camera's drift and the planet's turn are made by the runtime (the sliders `flow` and `drift`
# are their rates, the angles' constants are folded in), times how much is heard, so that they
# stop in silence. The raw numbers the scene keeps, because its shaders need the number itself:
# `energy` (the accent's strength, the planet's size, a bar's nudge, the light of the rings and the
# shapes), `audible` (the phase and the gate of every discrete move), `pace_tempo` (the length of a
# beat in seconds, for the fades and the counted beats), `core_bass` (the planet's swell with the
# bass) and `followed`.

# How much is heard, eased over half a second so that whatever goes by it slows with a song's own
# fade, so everything that moves stills in silence. The paces below, the scene's
# own phase (`state.phase`) and the discrete moves go by it: a move happens only while it is above
# 0.3.
[[input]]
id = "audible"
label = "How much is heard (falls with a fade, 0 in silence)"

# The energy of the moment: `intensity` sits between about 0.2 and 0.85, so it is spread over 0 to 1
# first, and eased over a second so that nothing follows it as a pulse (as Neon Street's signs and
# CRT Wall's screens do). It drives the paces, the accent's strength, the planet's size, a bar's
# nudge and the light of the rings and the shapes.
[[input]]
id = "energy"
label = "The energy of the moment, spread over the whole range and eased over a second (0 to 1)"
rest = 0.5

# A heard hit (at level A each beat followed): the scene counts them itself, at most one in half a
# beat and only while something is heard (see update.wgsl), since at levels B and C a hit is every
# onset (the kick, snare and hat) and can be dense.
[[input]]
id = "hit"
label = "A hit, or a beat where one is followed"

# A bar line, where the beat is followed (level A). At levels B and C there is none: the scene
# makes every fourth counted beat one (`followed` says which).
[[input]]
id = "bar_line"
label = "A bar line, where the beat is followed"

# Whether the music's bar lines are used (1) or the scene counts them itself (0). `bars` exist only
# at level A and no bind fallback can make every fourth counted beat of them (a fallback to `hits`
# would be a bar line on every hit), so the scene reads this and decides.
[[input]]
id = "followed"
label = "The beat is followed (1: the music's own bar lines; 0: every fourth counted beat is a bar line)"

# The kick: the percussive low band's onset envelope (it jumps to an onset's strength and
# decays), times `followed`, so only where the beat is followed (level A) and 0 at B and C: there
# the counted beats already are the heard onsets, the kick among them, and it would count them
# twice. (A bind `fallback` does not do this: `low` means something at every level.) A raw
# envelope because the scene needs the jump itself (see update.wgsl).
[[input]]
id = "kick"
label = "The kick's onset, dying away (only where the beat is followed)"

[[input]]
id = "section"
label = "A cue at least `cue_min` strong"

[[input]]
id = "core_bass"
label = "How far the bass is above its average (how much more the planet swells)"
range = [0, 1.5]

[[input]]
id = "pace_tempo"
label = "The tempo, held at 40 or more"
range = [40, 1000]

[[input]]
id = "spin_pace"
label = "How fast the ecliptic precesses, with the energy"
range = [-10, 10]

[[input]]
id = "drift_pace"
label = "How fast the camera drifts, with the energy"
range = [-10, 10]

[[input]]
id = "planet_pace"
label = "How fast the planet turns, with the energy"
range = [-10, 10]

[[input]]
id = "spin"
label = "The ecliptic's precession, summed"
range = [0, 1000000]

[[input]]
id = "cam_drift"
label = "The camera's drift, summed (starting anew with each shot)"
range = [0, 1000000]

[[input]]
id = "heard_tempo"
label = "The tempo, held at 40 or more, slowing with a fade and nil in silence"
range = [0, 1000]

[[input]]
id = "planet_turn"
label = "The planet's turn, summed (radians: a turn in 24 beats)"
range = [0, 1000000]

# How much is heard.
[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5, per = "second" }

[[bind]]
target = "energy"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 1.0, per = "second" }

[[bind]]
target = "hit"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

# `locked` is smoothed (0.3 s) and 0 or 1 at heart; read as a switch about one half.
[[bind]]
target = "kick"
source = "low"
how = "follow"
when = { mul = "input:followed" }

[[bind]]
target = "followed"
source = "locked"
how = "follow"
when = { from = [0.4, 0.6], to = [0.0, 1.0] }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "section"
source = "cues"
how = "trigger"
when = { strength = { param = "cue_min" }, scale = false, release = 0.0 }

# The bass above its average (1, as the band levels are about 1 on average), up to 1.5 above.
[[bind]]
target = "core_bass"
source = "band_low"
how = "follow"
when = { from = [1.0, 2.5], to = [0.0, 1.5] }

[[bind]]
target = "pace_tempo"
source = "tempo"
how = "follow"
when = { from = [40.0, 1000.0], to = [40.0, 1000.0] }

[[bind]]
target = "spin_pace"
source = "input:energy"
how = "follow"
when = { from = [0.0, 1.0], to = [0.35, 1.6] }

[[bind]]
target = "drift_pace"
source = "input:energy"
how = "follow"
when = { from = [0.0, 1.0], to = [0.6, 1.5] }

[[bind]]
target = "planet_pace"
source = "input:energy"
how = "follow"
when = { from = [0.0, 1.0], to = [0.6, 1.4] }

[[bind]]
target = "spin"
source = "input:spin_pace"
how = "accumulate"
when = { per = "second", mul = "input:audible", rate = { param = "flow", mul = 0.06 } }

[[bind]]
target = "cam_drift"
source = "input:drift_pace"
how = "accumulate"
when = { per = "second", mul = "input:audible", rate = { param = "drift" }, reset = "cut" }

# The tempo times how much is heard (a bind has one `mul`, and the planet's pace already has the
# tempo to multiply by).
[[bind]]
target = "heard_tempo"
source = "input:pace_tempo"
how = "follow"
when = { clamp = false, mul = "input:audible", to = [0.0, 1.0] }

# A turn is 24 beats of 60 / tempo seconds: 2 pi / 1440 radians a second for each bpm.
[[bind]]
target = "planet_turn"
source = "input:planet_pace"
how = "accumulate"
when = { per = "second", mul = "input:heard_tempo", rate = { param = "flow", mul = 0.0043633231 } }

# ---- Beat ----

[[param]]
id = "whirl_time"
group = "Beat"
label = "How long a ring takes over a whole turn (the big ones slower, the small ones quicker)"
unit = "s"
default = 1.6
min = 0.4
max = 4.0
step = 0.1

[[param]]
id = "sway"
group = "Beat"
label = "How hard a ring is pushed each bar (how far it swings out)"
unit = "°"
default = 8.0
min = 0.0
max = 30.0
step = 1.0

[[param]]
id = "flow"
group = "Beat"
label = "How fast things keep turning between beats (the ecliptic's precession, the planet's turn; faster as it is louder)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Colour ----

[[param]]
id = "follow"
type = "bool"
group = "Colour"
label = "Follow the player's theme colour (the system's accent, the chosen colour or the cover's)"
default = true

[[param]]
id = "theme"
type = "color"
group = "Colour"
label = "The theme colour when not following the player; only its hue and a little of its chroma are taken, and every colour is made from it (the looks then take the chroma down)"
default = "#007aff"

# ---- Sphere ----

[[param]]
id = "core"
group = "Sphere"
label = "How bright the planet's characters are (brighter with the energy, 0.65 to 1.25 times)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "core_kick"
group = "Sphere"
label = "How hard the planet swells on each heard hit"
default = 2.5
min = 0.0
max = 8.0
step = 0.1

[[param]]
id = "latitude"
group = "Sphere"
label = "Latitude (how the pole tips)"
unit = "°"
default = 35.0
min = 0.0
max = 90.0
step = 1.0

[[param]]
id = "accent"
group = "Sphere"
label = "How strong a beat must be to light (the first beat 0.55 to 1, the third 0.41 to 0.75, the others 0.28 to 0.5, stronger with the energy; at the default, only the first and third beats light in a quiet passage)"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "lit_beats"
group = "Sphere"
label = "How many beats a lit shape takes to fade by half"
unit = "beats"
default = 0.5
min = 0.1
max = 4.0
step = 0.05

[[param]]
id = "layer_bars"
type = "int"
group = "Sphere"
label = "Bars before the rings and the shapes swap turns at lighting"
default = 4
min = 1
max = 16
step = 1

[[param]]
id = "tick_spec"
group = "Sphere"
label = "How far the ecliptic's ticks reach with the spectrum"
unit = "m"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "spec_amp"
group = "Sphere"
label = "How far the ring drawn as the spectrum reaches out (another ring every four bars)"
unit = "m"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "bead_gap"
group = "Sphere"
label = "How far apart the dots round a ring are"
unit = "m"
default = 0.13
min = 0.05
max = 0.4
step = 0.01

[[param]]
id = "gap_grow"
group = "Sphere"
label = "How much further apart the dots are round the outer rings (0 the same)"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "bead_size"
group = "Sphere"
label = "How big the dots are"
unit = "m"
default = 0.022
min = 0.005
max = 0.08
step = 0.001

[[param]]
id = "light_reach"
group = "Sphere"
label = "How much of a ring an accent lights (turns)"
default = 1.0
min = 0.05
max = 1.0
step = 0.05

[[param]]
id = "light_spread"
group = "Sphere"
label = "Beats for a lit ring's dots to brighten, all together (0: at once)"
unit = "beats"
default = 0.5
min = 0.0
max = 4.0
step = 0.25

[[param]]
id = "kick_light"
group = "Sphere"
label = "How strongly a kick between the beats lights (the next ring, never the one lit just before; or the last batch of shapes again; only where the beat is followed; 0 is off)"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "light_beats"
group = "Sphere"
label = "How fast a lit ring dims: the time constant, in beats (0.25: it has fallen to 1/e in a quarter of a beat)"
unit = "beats"
default = 0.25
min = 0.05
max = 4.0
step = 0.05

[[param]]
id = "planet"
group = "Sphere"
label = "The text planet's radius"
unit = "m"
default = 1.0
min = 0.3
max = 1.4
step = 0.05

[[param]]
id = "text_rows"
group = "Sphere"
label = "Rows of characters across the planet"
default = 22.0
min = 8.0
max = 48.0
step = 1.0

[[param]]
id = "ring_glow"
group = "Sphere"
label = "How bright the rings' dots are at rest, and the line of the spectrum"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Polygons ----

[[param]]
id = "shapes"
group = "Shapes"
label = "How many shapes each accent lights (at most 24 a batch)"
default = 0.75
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "shape_size"
group = "Shapes"
label = "Shape size"
default = 1.0
min = 0.3
max = 3.0
step = 0.05

[[param]]
id = "shape_glow"
group = "Shapes"
label = "How bright the shapes are"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Camera ----

[[param]]
id = "lens"
group = "Camera"
label = "How far back, with a longer lens (higher flattens the perspective)"
default = 1.8
min = 0.6
max = 3.0
step = 0.05

[[param]]
id = "drift"
group = "Camera"
label = "How fast the camera pushes in or circles within a shot (0 still)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "cue_min"
group = "Camera"
label = "How strong a cue must be to fling the rings (1 a section that lifts the energy, 0.5 any other section, 0.3 every 8 bars while the beat is followed, 0.2 every 16 s without a beat)"
default = 0.2
min = 0.1
max = 1.0
step = 0.05
