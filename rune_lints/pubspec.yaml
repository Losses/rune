name: rune_lints
description: Analyzer rules for the Rune codebase.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  analysis_server_plugin: ^0.3.0
  # The Dart SDK that runs the plugin picks the analyzer, through its own
  # constraint on analysis_server_plugin.
  analyzer: any

dev_dependencies:
  analyzer_testing: any
  lints: ^6.0.0
  test: ^1.25.0
  test_reflective_loader: ^0.3.0
