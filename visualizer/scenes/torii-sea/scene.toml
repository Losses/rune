format = 1
name = "Torii Sea"
license = "MPL-2.0"
description = "Endless torii winding over the sea, waves breaking with the music"

common = ["sea.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md):
# A calm sea: a flash that turns the hour, a flare and a light leak, nothing harsh.
effects = ["fade", "dissolve", "flash", "flare", "leak"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel;
# 0.75 keeps the sea's crosses crosses (at 0.5 they blur into dots; the torii, listed per tile of
# the screen, cost a quarter of what they did, which pays for it); 0.5 a quarter of the pixels,
# 0.35 a little soft, below 0.25 the torii's edges turn to steps.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

# The close and the detail shot are near the spirits, so the director may burst to them before a
# section that lifts the energy.
[camera]
dutch = 0.3
fill = true
# A slow flight over the sea: cut half as often as an ordinary scene.
pace = "calm"

# Looking down the line from high behind, and from low behind to one side: both see the whole
# line and its sky, so both are wide. Then close among the spirits at a gate, and a long lens on
# their head.
[[shot]]
name = "high behind"
size = "wide"
move = "cut"

[[shot]]
name = "low beside"
size = "wide"
move = "cut"

[[shot]]
name = "at the gate"
size = "close"
move = "cut"

[[shot]]
name = "spirit's head"
size = "detail"
move = "cut"

[post]
exposure = 0.0
bloom = { intensity = 0.4, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.03
chromatic = 0.0
vignette = 0.2
contrast = 1.12
saturation = 1.05

