format = 1
name = "Neon Street"
license = "MPL-2.0"
description = "A shopping street at night, walked on the beat"

common = ["glyphs.wgsl", "city.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md):
# A neon street at night, in the spirit of Persona 5: the cut-in belongs here. Every lens effect.
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "cutin", "flash", "glitch"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare", "leak", "glitch", "mosaic"]

# The director cuts between the street's views. The camera never rolls of its own accord, and the
# director's dutch angle comes only with the cuts of a burst (a tilt on every cut was too much), and
# with the street side, which says so itself.
[camera]
dutch = 0.3
dutch_in = "bursts"

# Street level, looking down the street.
[[shot]]
name = "street"
size = "medium"
move = "cut"
# It may open a section of any kind: the views that open the others are not for a climax.
opens = true

# The street side: street level a little to one side (as the burst's first view), turned 30 to 36
# degrees towards the shops on the other side, their fronts and signs filling that side of the frame
# while the street leads away on the other (the old view across the street read poorly).
[[shot]]
name = "street side"
size = "close"
move = "cut"
dutch = true

# Above the signs, looking forward. A far view: not for the climax.
[[shot]]
name = "high"
size = "wide"
move = "cut"
tiers = ["quiet", "normal"]

# High over the city, looking down. Not for the climax either.
[[shot]]
name = "overview"
size = "wide"
move = "cut"
tiers = ["quiet", "normal"]

# The burst before a section that lifts, a cut on each of its last four beats, each to a new place
# along the street: street level looking ahead, close on a subject put there for it (a torii over
# the street, a bicycle, a traffic light, a street lamp, vending machines or a little shrine, by the
# shot's seed), closer on another of a different kind, and high up looking down the street (the shot
# beside a shop front became the first subject). (update.wgsl's cut() frames them, shot.index 4 to
# 7.)
[[burst]]
name = "street level"
size = "medium"

[[burst]]
name = "close on a subject"
size = "close"

[[burst]]
name = "close on a subject"
size = "detail"

[[burst]]
name = "high, down the street"
size = "top"

# The looks: the street at night in grey, and in the theme colour (grade.wgsl draws both and
# blends them). The runtime picks the look at a section start by the section's energy: grey in
# quiet and ordinary sections, the theme colour at the climax.
[[look]]
name = "grey"
tags = ["night"]
tiers = ["quiet", "normal"]

[[look]]
name = "theme colour"
tags = ["colour"]
tiers = ["high"]
opens = false
# A song with no high section would stay grey throughout: it is promised the look once, in its
# highest section then.
at_least_once = true

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "glyphs"
file = "assets/glyphs.png"
linear = true
source = "Glyphs rendered from Noto Sans JP, Dela Gothic One, Reggae One, Rampart One, RocknRoll One, Zen Antique, Yusei Magic and DotGothic16, each under the SIL Open Font License 1.1: https://openfontlicense.org/. The licence texts ship with the scene (assets/OFL.txt and assets/OFL-*.txt). Changed: rendered into a glyph atlas."

# The street is drawn at 0.75 of the screen's size and scaled up: about 1.75 times as fast.
[render]
scale = 0.75

# What each pixel's ray meets first (hit.wgsl), exactly, for street.wgsl to draw: in two passes a
# phone's GPU keeps more pixels in flight than in one.
[[buffer]]
id = "seen"
format = "rgba32float"

[[buffer]]
id = "street"

[[buffer]]
id = "inked"

[[buffer]]
id = "trail"
persistent = true

[[pass]]
shader = "hit.wgsl"
target = "seen"

[[pass]]
shader = "street.wgsl"
target = "street"
inputs = ["seen"]

[[pass]]
shader = "ink.wgsl"
target = "inked"
inputs = ["street"]

[[pass]]
shader = "compose.wgsl"
target = "trail"
inputs = ["inked", "prev:trail"]

[[pass]]
shader = "grade.wgsl"
target = "out"
inputs = ["trail"]

[post]
exposure = 0.0
bloom = { intensity = 0.55, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.035
chromatic = 0.0012
vignette = 0.45
contrast = 1.22
saturation = 1.05

# ---- What the music drives ----
# The scene says what it wants from the music and the runtime works it out (see "Bindings" in the
# runtime's docs/music.md); the shaders read the values as `input.<id>`, never `music.*`. The
# events the scene only needs to know of arrive as one-frame pulses (release 0); the envelopes
# whose time the scene sets (`shake_decay`) are made by the runtime. What the scene needs mapped
# (the pace, the bloom, the shake's gain, the brightness) is mapped here; only what its shaders
# need as it is comes through raw (an unclamped `follow`): `tempo` and `meter` for a bar's length
# in the build-up, `drive` for the share of dark signs (a power the bind cannot say), `next_energy`
# to compare with it, `label` and `section` (a kind and a number of section), `cue_in`.

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "tick"
label = "A followed beat"

[[input]]
id = "cue_mid"
label = "A cue of at least half strength"

[[input]]
id = "signal"
label = "The traffic lights, changing every four bars"

[[input]]
id = "lift_env"
label = "The shake of a lift, dying away as `shake_decay` says"

[[input]]
id = "impact_env"
label = "The shake of an impact, dying away as `shake_decay` says"

[[input]]
id = "label"
label = "The kind of section"
range = [-1.0, 1000.0]

[[input]]
id = "section"
label = "Which section, counted (every section its own number)"
range = [0.0, 1000000.0]

[[input]]
id = "tempo"
label = "The tempo"
range = [0.0, 1000.0]

[[input]]
id = "meter"
label = "Beats to the bar"
range = [0.0, 64.0]

[[input]]
id = "drive"
label = "Slow energy"

[[input]]
id = "next_energy"
label = "The energy of the next section"

[[input]]
id = "pace"
label = "How fast the song is against 90 bpm (0.4 to 2 times)"
range = [0.4, 2.0]
rest = 1.0

[[input]]
id = "bloom"
label = "The bloom's strength, by the slow energy"
range = [0.0, 6.0]
rest = 0.55

[[input]]
id = "gain"
label = "How much a shake is scaled by the loudness (more when loud)"
range = [0.0, 3.0]
rest = 1.0

[[input]]
id = "energy"
label = "The energy of the moment, spread over the whole range"

[[input]]
id = "audible"
label = "How much is heard (falling with a fade, 0 in silence)"
rest = 1.0

[[input]]
id = "cue_in"
label = "Seconds to the next section (-1: unknown)"
range = [-1.0, 1000.0]
rest = -1.0

[[input]]
id = "bright"
label = "How bright the signs and shop fronts are, by the energy (a 1 s average)"
range = [0.0, 2.0]
rest = 1.0

[[input]]
id = "bass_swell"
label = "The bass's swell round the usual brightness (0 at an average bass)"
range = [-1.0, 1.0]

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tick"
source = "beats"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "cue_mid"
source = "cues"
how = "trigger"
when = { strength = 0.5, scale = false, release = 0.0 }

[[bind]]
target = "signal"
source = "clock"
how = "step"
ease = "none"
when = { every = 4, unit = "bar", wrap = 2 }

[[bind]]
target = "lift_env"
source = "cues"
how = "trigger"
when = { strength = 0.95, scale = false, decay = "exp", release = { param = "shake_decay" }, per = "second", decay_from = "event" }

[[bind]]
target = "impact_env"
source = "impacts"
how = "trigger"
when = { decay = "exp", release = { param = "shake_decay" }, per = "second", decay_from = "event" }

[[bind]]
target = "label"
source = "section_label"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "section"
source = "section"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "meter"
source = "meter"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "drive"
source = "drive"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "next_energy"
source = "next_energy"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# How fast the song is against 90 bpm, which is what a cruise is at: the tempo over 90, kept to
# 0.4 to 2 times (36 to 180 bpm).
[[bind]]
target = "pace"
source = "tempo"
how = "follow"
when = { from = [36.0, 180.0] }

# The bloom: `glow` at a quiet moment's 0.7 up to 1.3 times it at the loudest, by the slow energy
# (the look's own dimmer grey is update's).
[[bind]]
target = "bloom"
source = "drive"
how = "follow"
when = { to = [{ param = "glow", mul = 0.7 }, { param = "glow", mul = 1.3 }] }

# What scales a shake by the loudness: `shake_energy` of the way from the same shake at every
# loudness (1) to a quiet one at nothing and a loud one at 1.25 times (the intensity squared, as
# the source times itself).
[[bind]]
target = "gain"
source = "intensity"
how = "follow"
when = { mul = "intensity", to = [{ param = "shake_energy", mul = -1.0, add = 1.0 }, { param = "shake_energy", mul = 0.25, add = 1.0 }] }

# The energy of the moment, its usual span spread over the whole range (as Torii Sea's): the glide
# is slow in a quiet passage. And how much is heard, smoothed over half a beat: a fade slows the
# glide and silence nearly stills it.
[[bind]]
target = "energy"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 0.5 }

[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5 }

[[bind]]
target = "cue_in"
source = "cue_in"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }
fallback = { value = -1.0 }

# How much brighter or dimmer the signs and shop fronts are with the energy: `energy_light` of
# the way from a usual brightness at the middle of the energy's span to 0.6 times it when quiet and
# 1.4 times when loud, over a second so that it reads as a passage and not a pulse (so the energy
# reads on screen). How many signs are dark stays on the slow `drive` (update): a count following
# the fast energy would pop signs on and off.
[[bind]]
target = "bright"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 1.0, per = "second", to = [{ param = "energy_light", mul = -0.4, add = 1.0 }, { param = "energy_light", mul = 0.4, add = 1.0 }] }

# The bass swells the brightness round what it is: 0 where the low band is at its average (1), up
# to 0.3 times `bass_glow` above it at twice that and as far below at none, smoothed over 0.15 s.
[[bind]]
target = "bass_swell"
source = "band_low"
how = "follow"
when = { from = [0.0, 2.0], smooth = 0.15, per = "second", to = [{ param = "bass_glow", mul = -0.3 }, { param = "bass_glow", mul = 0.3 }] }

# ---- Beat ----

[[param]]
id = "shake"
group = "Beat"
label = "Shake"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "shake_energy"
group = "Beat"
label = "Shake follows loudness"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "shake_decay"
group = "Beat"
label = "How long a shake lasts"
unit = "s"
default = 0.35
min = 0.05
max = 1.5
step = 0.05

# ---- Camera ----

[[param]]
id = "cruise"
group = "Camera"
label = "Speed down low (3 m and under) for music of middling pace (half when quiet, 1.3 times when loud; slower in a fade and in silence)"
unit = "m/s"
default = 4.2
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "cruise_high"
group = "Camera"
label = "Speed up high (45 m) for music of middling pace (0.6 times when quiet, 1.1 times when loud); between the two by the height"
unit = "m/s"
default = 2.5
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "energy_speed"
group = "Camera"
label = "Energy on the speed (0 none; 1 down low half speed when quiet and 1.3 times when loud, up high 0.6 to 1.1 times)"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "push"
group = "Camera"
label = "Push on the beat (down low; a third of it up high)"
unit = "m/s"
default = 0.9
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "ease"
group = "Camera"
label = "Back to cruise"
unit = "s"
default = 0.5
min = 0.05
max = 2.0
step = 0.05

[[param]]
id = "accel"
group = "Camera"
label = "Smoothness"
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "build_bars"
group = "Camera"
label = "Build-up bars"
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "build"
group = "Camera"
label = "Push in before a louder section"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

