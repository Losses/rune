format = 1
name = "Growth"
license = "MPL-2.0"
description = "A tower of plates growing up into white light, a step on every beat"

common = ["tower.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md):
# A tower that grows towards the light: a flash, a flare and a light leak.
effects = ["fade", "dissolve", "flash", "flare", "leak"]

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "concrete"
file = "assets/surface.png"
# Data, not colour: the normal, how open each spot is and the face's tone.
linear = true
source = "Made by tools/make_surface.py"

[[buffer]]
id = "layers"
# The layers of the tower a ray can meet this frame (see layers.wgsl): a few thousand texels,
# worked out once instead of by every pixel.
format = "rgba32float"
scale = 0.1

[[buffer]]
id = "lit"
# Drawn at two thirds of the screen's resolution: the haze and the depth of field hide it, and
# it costs under half as much (for phones). 0.5 is faster still, with a little stair-stepping.
scale = 0.67

[[pass]]
shader = "layers.wgsl"
target = "layers"

[[pass]]
shader = "view.wgsl"
target = "lit"
inputs = ["layers"]

[[pass]]
shader = "dof.wgsl"
target = "out"
inputs = ["lit"]

# The camera's views, in the order update.wgsl takes them (0 close, 1 closer, 2 and 3 further
# off); the camera glides between them. The tilt is the director's dutch angle, none in a wide
# shot.
[camera]
dutch = 0.4
fill = true
# The shortest shot is about the default glide (4 s), two bars at 90 to 120 bpm.
hold = 2

[[shot]]
name = "steep"
size = "medium"
move = "glide"

[[shot]]
name = "near"
size = "close"
move = "glide"

[[shot]]
name = "far"
size = "wide"
move = "glide"

[[shot]]
name = "far again"
size = "wide"
move = "glide"

[post]
exposure = 0.0
bloom = { intensity = 0.7, threshold = 0.95, radius = 0.8 }
tonemap = "agx"
grain = 0.04
chromatic = 0.0008
vignette = 0.12
contrast = 0.95
saturation = 0.85

# ---- What the music drives ----
# Everything the scene hears goes through these (see "Bindings" in the runtime's docs/music.md);
# the shaders read input.<id>.

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "tick"
label = "A followed beat"

[[input]]
id = "bar_line"
label = "A bar line"

[[input]]
id = "cue"
label = "A cue strong enough to change the theme (its strength)"

[[input]]
id = "lift"
label = "A section that lifts the energy"

[[input]]
id = "impact"
label = "The strength of an impact"

[[input]]
id = "flash_lift"
label = "The flash of a lift, fading over 0.35 s"

[[input]]
id = "flash_hit"
label = "The flash of an impact, fading over 0.35 s"

[[input]]
id = "bar"
label = "The bar"
range = [0.0, 1000000.0]

[[input]]
id = "tempo"
label = "The tempo"
range = [0.0, 1000.0]

[[input]]
id = "locked"
label = "How much the beat is followed"

[[input]]
id = "drive"
label = "Slow energy"

[[input]]
id = "kick"
label = "The kick"

[[input]]
id = "theme_pick"
label = "The white-light theme, by section (-1: none)"
range = [-1.0, 4.0]
rest = -1.0

[[input]]
id = "tone_pick"
label = "The concrete's light, by section (-1: none)"
range = [-1.0, 2.0]
rest = -1.0

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tick"
source = "beats"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "cue"
source = "cues"
how = "trigger"
when = { strength = { param = "theme_cue" }, release = 0.0 }

[[bind]]
target = "lift"
source = "cues"
how = "trigger"
when = { strength = 0.95, scale = false, release = 0.0 }

[[bind]]
target = "impact"
source = "impacts"
how = "trigger"
when = { release = 0.0 }

[[bind]]
target = "flash_lift"
source = "cues"
how = "trigger"
when = { strength = 0.95, scale = false, decay = "exp", release = 0.35, per = "second" }

[[bind]]
target = "flash_hit"
source = "impacts"
how = "trigger"
when = { decay = "exp", release = 0.35, per = "second" }

[[bind]]
target = "bar"
source = "bar"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "locked"
source = "locked"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "drive"
source = "drive"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "kick"
source = "low"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "theme_pick"
source = "section_label"
how = "pick"
when = { options = 5 }
fallback = "rest"

[[bind]]
target = "tone_pick"
source = "section_label"
how = "pick"
when = { options = 3 }
fallback = "rest"

# ---- Beat ----

[[param]]
id = "hits"
group = "Beat"
label = "Kicks between beats"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = "Beat"
label = "Kick decay"
unit = "s"
default = 0.15
min = 0.04
max = 1.0
step = 0.01

[[param]]
id = "glow"
group = "Beat"
label = "Glow"
default = 0.7
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "glow_beat"
group = "Beat"
label = "Glow on the beat"
default = 0.5
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "pump"
group = "Beat"
label = "Brighten on the beat"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "zoom"
group = "Beat"
label = "Zoom on the beat"
default = 0.012
min = 0.0
max = 0.1
step = 0.002

# ---- Growth ----

[[param]]
id = "grow"
group = "Growth"
label = "Layers grown on a beat"
default = 1.5
min = 0.5
max = 8.0
step = 0.25

[[param]]
id = "bar_boost"
group = "Growth"
label = "Growth on a bar's first beat (times)"
default = 2.5
min = 1.0
max = 6.0
step = 0.25

[[param]]
id = "snap"
group = "Growth"
label = "How fast each growth snaps up"
unit = "s"
default = 0.12
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "arrive"
group = "Growth"
label = "How fast new plates slam into place"
unit = "s"
default = 0.2
min = 0.04
max = 1.0
step = 0.01

[[param]]
id = "fly"
group = "Growth"
label = "How far new plates fly in from (cells)"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "scatter"
group = "Tower"
label = "Small plates between the big ones"
default = 0.35
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "fresh"
group = "Growth"
label = "Flash of new plates"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Tower ----

[[param]]
id = "girth"
group = "Tower"
label = "Girth of the tower"
unit = "m"
default = 5.0
min = 2.0
max = 16.0
step = 0.25

[[param]]
id = "vary"
group = "Tower"
label = "How much each layer's width varies"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "taper"
group = "Tower"
label = "Length of the taper to the tip"
unit = "m"
default = 16.0
min = 2.0
max = 60.0
step = 1.0

[[param]]
id = "density"
group = "Tower"
label = "How many slabs each layer lays"
default = 0.8
min = 0.05
max = 1.0
step = 0.01

[[param]]
id = "loose"
group = "Tower"
label = "Loose plates floating round"
default = 0.3
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "core"
group = "Tower"
label = "Radius of the hollow core"
unit = "m"
default = 1.2
min = 0.0
max = 4.0
step = 0.1

# ---- Camera ----

[[param]]
id = "glide"
group = "Camera"
label = "Time to glide between views"
unit = "s"
default = 4.0
min = 0.5
max = 20.0
step = 0.5

[[param]]
id = "follow"
group = "Camera"
label = "Time for the camera to catch the tip"
unit = "s"
default = 0.8
min = 0.05
max = 5.0
step = 0.05

[[param]]
id = "keep_below"
group = "Camera"
label = "How much of the tower below the camera is kept (less is cheaper)"
unit = "m"
default = 10.0
min = 0.0
max = 60.0
step = 1.0

# ---- Look ----

[[param]]
id = "style"
type = "choice"
group = "Look"
label = "Style"
default = 1
options = ["White light (the video)", "Concrete"]

[[param]]
id = "light"
type = "choice"
group = "Look"
label = "Light on the concrete"
default = 1
options = ["By section", "Low warm sun", "High white sun", "Blue hour"]

[[param]]
id = "surface"
group = "Look"
label = "Surface detail (pores, seams, tie holes)"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "bevel"
group = "Look"
label = "Rounding of the edges"
unit = "m"
default = 0.05
min = 0.0
max = 0.15
step = 0.005

[[param]]
id = "shadows"
group = "Look"
