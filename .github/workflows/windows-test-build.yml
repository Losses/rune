name: Windows Test Build (x64 & ARM64)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'

jobs:
  # Resolve the dispatch input into a concrete build matrix so that an
  # unselected architecture never creates a job at all (instead of a job that
  # skips every step and reports a misleading green checkmark).
  select-archs:
    name: Select target architectures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set-matrix
        env:
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          x64='{"arch":"x64","system":"x86_64-windows","rust_target":"x86_64-pc-windows-msvc"}'
          arm64='{"arch":"arm64","system":"aarch64-windows","rust_target":"aarch64-pc-windows-msvc"}'
          case "$ARCH" in
            both)  echo "matrix={\"include\":[$x64,$arm64]}" >> "$GITHUB_OUTPUT" ;;
            x64)   echo "matrix={\"include\":[$x64]}" >> "$GITHUB_OUTPUT" ;;
            arm64) echo "matrix={\"include\":[$arm64]}" >> "$GITHUB_OUTPUT" ;;
          esac

  build-windows:
    needs: select-archs
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-archs.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install nova-nix (Native Windows Nix engine)
      - name: Setup nova-nix
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\.nova-nix"
          $zip = "$dest\nova-nix.zip"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Novavero-AI/nova-nix/releases/download/v0.7.0.0/nova-nix-windows-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Remove-Item $zip
          $novaBin = "$dest\nova-nix-windows-x64\bin"
          Add-Content $env:GITHUB_PATH "$novaBin"
          Write-Host "nova-nix installed successfully to $novaBin"

      # 2. Nix Store Cache (C:\nix\store)
      - name: Cache Nix Store
        uses: actions/cache@v4
        with:
          path: C:\nix\store
          key: nova-nix-store-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('nix/platforms/windows/**', 'windows.nix') }}
          restore-keys: |
            nova-nix-store-${{ runner.os }}-${{ matrix.arch }}-
            nova-nix-store-${{ runner.os }}-

      # 3. Flutter Pub Dependencies Cache
      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      # 4. Cargo registry and git cache
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('native/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ matrix.arch }}-
            cargo-deps-${{ runner.os }}-

      # 5. Evaluate and verify Windows platform derivations with nova-nix
      - name: Evaluate Platform Nix Derivations
        shell: pwsh
        run: |
          nova-nix eval windows.nix
          nova-nix eval --expr '(import ./nix/platforms/windows/default.nix { system = "${{ matrix.system }}"; }).devShells.default.name'

      # 6. Build all toolchains from Nix store via nova-nix
      #    (Rust and Flutter now come from Nix, replacing external actions)
      - name: Realize Toolchains from Nix Store
        shell: pwsh
        run: |
          # nova-nix v0.7.0.0's `build` only accepts a .nix file as its target
          # (`--expr` exists for `eval` only), so wrap the attribute paths in files.
          Set-Content -Path ".\cmake-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).tools.cmake"
          Set-Content -Path ".\ninja-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).tools.ninja"
          $cmakeOut = nova-nix build .\cmake-attr.nix 2>&1 | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
          $ninjaOut = nova-nix build .\ninja-attr.nix 2>&1 | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
          if (-not $cmakeOut) { throw "nova-nix build did not report a store path for cmake (see output above)" }
          if (-not $ninjaOut) { throw "nova-nix build did not report a store path for ninja (see output above)" }
          Write-Host "CMake in Nix store: $cmakeOut"
          Write-Host "Ninja in Nix store: $ninjaOut"
          Add-Content $env:GITHUB_PATH "$cmakeOut\bin"
          Add-Content $env:GITHUB_PATH "$ninjaOut"

          # Build Rust toolchain (x64 host; the aarch64 MSI cannot run on x64)
          Set-Content -Path ".\rust-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).rust.package"
          $rustOut = nova-nix build .\rust-attr.nix 2>&1 | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
          if (-not $rustOut) { throw "nova-nix build did not report a store path for rust (see output above)" }
          Write-Host "Rust in Nix store: $rustOut"
          $rustBin = "$rustOut\Rust\bin"
          $env:PATH = "$rustBin;" + $env:PATH

          # Link the nova-nix toolchain so rustup can add cross-compile targets.
          & "$rustBin\rustup.exe" toolchain link nova-nix "$rustOut\Rust"
          & "$rustBin\rustup.exe" default nova-nix

          # ARM64 cross-compile: the nova-nix store may be read-only, so
          # copy the x64-host toolchain to a writable temp directory before
          # letting rustup download the aarch64 standard library.
          if ("${{ matrix.arch }}" -eq "arm64") {
            Write-Host "Copying Rust toolchain to writable temp for cross-compile targets..."
            $rustStore = $rustOut
            $rustOut = "$env:RUNNER_TEMP\nova-nix-rust"
            New-Item -ItemType Directory -Force -Path "$rustOut" | Out-Null
            Copy-Item -Recurse -Force "$rustStore\Rust\*" "$rustOut\"
            $rustBin = "$rustOut\bin"
            $env:PATH = ($env:PATH -replace [regex]::Escape("$rustStore\Rust\bin"), $rustBin)
            # Re-link rustup to the writable copy.
            & "$rustBin\rustup.exe" toolchain link nova-nix "$rustOut"
            & "$rustBin\rustup.exe" default nova-nix
            Write-Host "Adding aarch64-pc-windows-msvc cross-compile target..."
            & "$rustBin\rustup.exe" target add aarch64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "rustup target add aarch64-pc-windows-msvc failed" }
            Write-Host "Rust toolchain ready at: $rustOut"
          }

          # Publish the final Rust bin dir for downstream steps (store for x64,
          # writable temp copy for arm64) - exactly one entry, so cargo resolves
          # to the toolchain that has the aarch64 std on arm64.
          Add-Content $env:GITHUB_PATH "$rustBin"

          # Build Flutter SDK (architecture-independent zip shared by both arches)
          Set-Content -Path ".\flutter-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).flutter.package"
          $flutterOut = nova-nix build .\flutter-attr.nix 2>&1 | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
          if (-not $flutterOut) { throw "nova-nix build did not report a store path for flutter (see output above)" }
          Write-Host "Flutter in Nix store: $flutterOut"
          Add-Content $env:GITHUB_PATH "$flutterOut\flutter\bin"

      # 7. Install Inno Setup compiler for installer generation
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      # 8. Install Rinf CLI
      - name: Install Rinf CLI
        run: |
          cargo install rinf_cli --version 8.7.2 --locked --force

      # 9. Run One-Click Windows Build (MSVC + CargoKit Shim + Runner + Inno Setup)
      - name: Run Windows One-Click Build
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            # Flutter runner cannot cross-compile to ARM64 from an x64 host.
            .\scripts\windows_build.ps1 -Arch arm64 -SkipFlutterBuild
          } else {
            .\scripts\windows_build.ps1 -Arch ${{ matrix.arch }} -BuildInstaller
          }

      # 10. Upload ARM64 hub.dll (cross-compiled Rust core; Flutter runner is x64-only)
      - name: Upload ARM64 hub.dll
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: Rune-windows-arm64-hub
          path: target/aarch64-pc-windows-msvc/release/hub.dll
          if-no-files-found: error

      # 11. Upload Portable Application Artifact (x64 only; ARM64 Flutter
      #     runner cannot be cross-compiled from an x64 host)
      - name: Upload Portable Application Artifact
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: Rune-windows-${{ matrix.arch }}-portable
          path: build/windows/${{ matrix.arch }}/runner/Release/
          if-no-files-found: error

      # 12. Upload Inno Setup Installer Artifact (x64 only)
      - name: Upload Inno Setup Installer Artifact
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: Rune-windows-${{ matrix.arch }}-installer
          path: Output/Rune-${{ matrix.arch }}-Setup.exe
          if-no-files-found: warn
