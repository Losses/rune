format = 1
name = "Growth"
license = "MPL-2.0"
description = "A tower of concrete plates growing up, a step on every beat, its light changing with the sections"

common = ["tower.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md): A tower
# that grows towards the light: a flash, and every lens effect. The flashes and glitches are the
# runtime's, at the music's moments; the scene keeps none of its own.
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "dissolve", "flash", "glitch"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare", "leak", "glitch", "mosaic"]

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "concrete"
file = "assets/surface.png"
# Data, not colour: the normal, how open each spot is and the face's tone.
linear = true
source = "Made by tools/make_surface.py"

[[buffer]]
id = "layers"
# The layers of the tower a ray can meet this frame (see layers.wgsl): a few thousand texels,
# worked out once instead of by every pixel.
format = "rgba32float"
scale = 0.1

[[buffer]]
id = "lit"
# Drawn at two thirds of the screen's resolution: the haze and the depth of field hide it, and
# it costs under half as much (for phones). 0.5 is faster still, with a little stair-stepping.
scale = 0.67

[[pass]]
shader = "layers.wgsl"
target = "layers"

[[pass]]
shader = "view.wgsl"
target = "lit"
inputs = ["layers"]

[[pass]]
shader = "dof.wgsl"
target = "out"
inputs = ["lit"]

# The camera's views, in the order update.wgsl takes them (0 close, 1 closer, 2 further off, 3
# from not far above the tip); a cut jumps to the next. The tilt is the director's dutch
# angle, none in a wide or a top shot: a few degrees, so it reads as a lean and not a fall.
[camera]
dutch = 0.15

[[shot]]
name = "steep"
size = "medium"
move = "cut"

[[shot]]
name = "near"
size = "close"
move = "cut"

[[shot]]
name = "far"
size = "wide"
move = "cut"

[[shot]]
name = "above"
size = "top"
move = "cut"
# It may open a section as the wide shots do.
opens = true

# The burst before a section that lifts, a cut on each of its last four beats, as the tower grows
# a step on each (after the reference video's three pushes in and a look from above): under the
# tip, close on its other side, one plate landing, and high above the tip. Each comes from a new
# side of the tower.
[[burst]]
name = "under the tip"
size = "medium"

[[burst]]
name = "the other side"
size = "close"

[[burst]]
name = "a plate landing"
size = "detail"

[[burst]]
name = "high above"
size = "top"

# The looks: one material, concrete, under three lights (update.wgsl draws them, as `theme_of`
# in state.wgsl; the order is the order it takes). The runtime decides when the light changes: a
# section start picks the look by the section's label (the same each time), and the song's first
# light is picked from the scene's seed (see "Looks" in the runtime's docs/music.md).
[[look]]
name = "low sun"
tags = ["warm"]

[[look]]
name = "high sun"

[[look]]
name = "blue hour"
tags = ["night"]

[post]
exposure = 0.0
# Only the sun glares; the lens is a clean one.
bloom = { intensity = 0.18, threshold = 0.95, radius = 0.8 }
tonemap = "agx"
grain = 0.02
chromatic = 0.0
vignette = 0.25
contrast = 0.95
saturation = 0.85

# ---- What the music drives ----
# Everything the scene hears goes through these (see "Bindings" in the runtime's docs/music.md);
# the shaders read input.<id>.

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "tick"
label = "A followed beat"

[[input]]
id = "bar_line"
label = "A bar line"

[[input]]
id = "tempo"
label = "The tempo"
range = [0.0, 1000.0]

[[input]]
id = "locked"
label = "How much the beat is followed"

[[input]]
id = "drive"
label = "Slow energy"

[[input]]
id = "kick"
label = "The kick"

[[input]]
id = "audible"
label = "How much is heard (falling with a fade, 0 in silence)"
rest = 1.0

[[input]]
id = "fill"
label = "How wide and full a new layer is, by the energy"
rest = 0.65

[[input]]
id = "rod"
label = "How bright the rod is, by the energy"

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tick"
source = "beats"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "locked"
source = "locked"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "drive"
source = "drive"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "kick"
source = "low"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# The camera circles at the tempo while the music is heard: it slows with the song's own fade
# and stops in silence, smoothed over half a beat so that it does not twitch.
[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5 }

# How wide and full the layers that grow now are: a loud passage lays a wide, covered layer, a
# quiet one a thin column of a few plates. The energy's usual span is spread over the whole range.
[[bind]]
target = "fill"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85] }

# The rod up the core breathes with the energy, smoothed over a beat: no flashes.
[[bind]]
target = "rod"
source = "intensity"
how = "follow"
when = { smooth = 1.0 }

# ---- Beat ----

[[param]]
id = "hits"
group = "Beat"
label = "Kicks between beats"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = "Beat"
label = "Kick decay"
unit = "s"
default = 0.15
min = 0.04
max = 1.0
step = 0.01

[[param]]
id = "glow"
group = "Beat"
label = "Glow"
default = 0.18
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "zoom"
group = "Beat"
label = "Zoom on the beat"
default = 0.012
min = 0.0
max = 0.1
step = 0.002

# ---- Growth ----

[[param]]
id = "grow"
group = "Growth"
label = "Layers grown on a beat"
default = 1.5
min = 0.5
max = 8.0
step = 0.25

[[param]]
id = "bar_boost"
group = "Growth"
label = "Growth on a bar's first beat (times)"
default = 2.5
min = 1.0
max = 6.0
step = 0.25

[[param]]
id = "snap"
group = "Growth"
label = "How fast each growth snaps up"
unit = "s"
default = 0.12
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "arrive"
group = "Growth"
label = "How fast new plates slam into place"
unit = "s"
default = 0.2
min = 0.04
max = 1.0
step = 0.01

[[param]]
id = "fly"
group = "Growth"
label = "How far new plates fly in from (cells)"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "scatter"
group = "Tower"
label = "Small plates between the big ones"
default = 0.35
min = 0.0
max = 1.0
step = 0.01

# ---- Tower ----

[[param]]
id = "girth"
group = "Tower"
label = "Girth of the tower"
unit = "m"
default = 5.0
min = 2.0
max = 16.0
step = 0.25

[[param]]
id = "vary"
group = "Tower"
label = "How much each layer's width varies"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "taper"
group = "Tower"
label = "Length of the taper to the tip"
unit = "m"
default = 16.0
min = 2.0
max = 60.0
step = 1.0

[[param]]
id = "density"
group = "Tower"
label = "How many slabs each layer lays"
default = 0.8
min = 0.05
max = 1.0
step = 0.01

[[param]]
id = "loose"
group = "Tower"
label = "Loose plates floating round"
default = 0.3
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "core"
group = "Tower"
label = "Radius of the hollow core"
unit = "m"
default = 1.2
min = 0.0
max = 4.0
step = 0.1

# ---- Camera ----

[[param]]
id = "follow"
group = "Camera"
label = "Time for the camera to catch the tip"
unit = "s"
default = 1.5
min = 0.05
max = 5.0
step = 0.05

[[param]]
id = "keep_below"
group = "Camera"
label = "How much of the tower below the camera is kept (less is cheaper)"
unit = "m"
default = 10.0
min = 0.0
max = 60.0
step = 1.0

# ---- Look ----

[[param]]
id = "light"
type = "choice"
group = "Look"
label = "Light (a fixed one overrides the runtime's changes by section)"
default = 0
options = ["Automatic", "Low warm sun", "High white sun", "Blue hour"]

[[param]]
id = "surface"
group = "Look"
label = "Surface detail (pores, seams, tie holes)"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "bevel"
group = "Look"
label = "Rounding of the edges"
unit = "m"
default = 0.05
min = 0.0
max = 0.15
step = 0.005

[[param]]
id = "shadows"
group = "Look"
label = "Shadows"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "rod_light"
group = "Look"
label = "The rod lighting the core"
default = 0.3
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "player_colour"
type = "bool"
group = "Look"
label = "Follow the player's theme colour (the system's accent, the chosen colour or the cover's): each theme keeps its lights and darks and how colourful it is, in its hue"
default = true

[[param]]
id = "chroma"
group = "Look"
label = "How colourful, following the player (0 is black and white)"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "fog"
group = "Look"
label = "Haze"
default = 0.2
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "dof"
group = "Look"
label = "Depth of field"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "rod_width"
group = "Look"
label = "Width of the rod of light"
unit = "m"
default = 0.07
min = 0.0
max = 0.5
step = 0.01

[[param]]
id = "rod_glow"
group = "Look"
label = "Glow of the rod"
default = 1.0
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "dust"
group = "Look"
label = "Dust"
default = 1.0
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "exposure"
group = "Look"
label = "Exposure"
unit = "EV"
default = 0.5
min = -3.0
max = 3.0
step = 0.05
