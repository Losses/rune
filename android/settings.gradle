pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.0" apply false
    id "org.jetbrains.kotlin.android" version "2.2.21" apply false
}

include ":app"

// Apple Music plays through Apple's MusicKit for Android, whose AARs may not be redistributed. The
// module that uses them is only part of a build that is given the folder holding them, as the
// Gradle property `runeAppleMusicSdkDir` (or the environment variable
// `ORG_GRADLE_PROJECT_runeAppleMusicSdkDir`). Without it the app has no Apple Music at all.
if (providers.gradleProperty("runeAppleMusicSdkDir").isPresent()) {
    include ":apple_music"
}
