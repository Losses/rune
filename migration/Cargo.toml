[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
once_cell = "1.21.3"
uuid = { version = "1", features = ["v4", "v5"] }

[dependencies.sea-orm-migration]
version = "2.0.4"
features = [
  "runtime-tokio-native-tls",
  "sqlx-sqlite",
]
