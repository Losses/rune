format = 1
name = "Neon Street"
license = "MPL-2.0"
description = "A shopping street at night, walked on the beat"

common = ["glyphs.wgsl", "city.wgsl"]

# The director cuts between the street's views. The small roll wobble of the camera stays; the
# director's dutch angle comes on top of it.
[camera]
dutch = 0.3
fill = true

# Street level, looking down the street.
[[shot]]
name = "street"
size = "medium"
move = "cut"

# From one side, looking across at the shops opposite.
[[shot]]
name = "aside"
size = "close"
move = "cut"

# Above the signs, looking forward.
[[shot]]
name = "high"
size = "wide"
move = "cut"

# High over the city, looking down.
[[shot]]
name = "overview"
size = "wide"
move = "cut"

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "glyphs"
file = "assets/glyphs.png"
linear = true
source = "Rendered from Noto Sans JP (SIL Open Font License 1.1, assets/OFL.txt) by tools/make_glyphs.py"

# The street is drawn at 0.75 of the screen's size and scaled up: about 1.75 times as fast.
[render]
scale = 0.75

# What each pixel's ray meets first (hit.wgsl), exactly, for street.wgsl to draw: in two passes a
# phone's GPU keeps more pixels in flight than in one.
[[buffer]]
id = "seen"
format = "rgba32float"

[[buffer]]
id = "street"

[[buffer]]
id = "inked"

[[buffer]]
id = "trail"
persistent = true

[[pass]]
shader = "hit.wgsl"
target = "seen"

[[pass]]
shader = "street.wgsl"
target = "street"
inputs = ["seen"]

[[pass]]
shader = "ink.wgsl"
target = "inked"
inputs = ["street"]

[[pass]]
shader = "compose.wgsl"
target = "trail"
inputs = ["inked", "prev:trail"]

[[pass]]
shader = "grade.wgsl"
target = "out"
inputs = ["trail"]

[post]
exposure = 0.0
bloom = { intensity = 0.55, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.035
chromatic = 0.0012
vignette = 0.45
contrast = 1.22
saturation = 1.05

# ---- Beat ----

[[param]]
id = "hits"
group = "Beat"
label = "Kicks between beats"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = "Beat"
label = "Kick decay"
unit = "s"
default = 0.15
min = 0.04
max = 0.6
step = 0.01

[[param]]
id = "shake"
group = "Beat"
label = "Shake"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "shake_energy"
group = "Beat"
label = "Shake follows loudness"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "shake_decay"
group = "Beat"
label = "How long a shake lasts"
unit = "s"
default = 0.35
min = 0.05
max = 1.5
step = 0.05

[[param]]
id = "pump"
group = "Beat"
label = "Brightness on the kick"
default = 0.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "zoom"
group = "Beat"
label = "Zoom on the kick"
default = 0.0
min = 0.0
max = 0.2
step = 0.005

# ---- Camera ----

[[param]]
id = "cruise"
group = "Camera"
label = "Speed for music of middling pace"
unit = "m/s"
default = 4.5
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "energy_speed"
group = "Camera"
label = "Speed follows the energy"
default = 0.3
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "push"
group = "Camera"
label = "Push on the beat"
unit = "m/s"
default = 1.5
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "ease"
group = "Camera"
label = "Back to cruise"
unit = "s"
default = 0.5
min = 0.05
max = 2.0
step = 0.05

[[param]]
id = "accel"
group = "Camera"
label = "Smoothness"
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "build_bars"
group = "Camera"
label = "Build-up bars"
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "build"
group = "Camera"
label = "Push in before a louder section"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

# ---- Hard cuts ----

[[param]]
id = "same_view"
