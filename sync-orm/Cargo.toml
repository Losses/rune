[package]
name = "sync-orm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sync = { path = "../sync" }
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
anyhow = "1.0.98"
async-trait = "0.1.88"
chrono = "0.4.40"
blake3 = "=1.7.0"
serde_json = "1.0.140"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
