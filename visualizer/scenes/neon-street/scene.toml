format = 1
name = "Neon Street"
license = "MPL-2.0"
description = "A shopping street at night, walked on the beat"

common = ["glyphs.wgsl", "city.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md):
# A neon street at night, in the spirit of Persona 5: the cut-in belongs here.
effects = ["fade", "cutin", "flash", "glitch", "flare"]

# The director cuts between the street's views. The camera never rolls of its own accord, and the
# director's dutch angle comes only with the cuts of a burst (a tilt on every cut was too much), and
# with the street side, which says so itself.
[camera]
dutch = 0.3
dutch_in = "bursts"

# Street level, looking down the street.
[[shot]]
name = "street"
size = "medium"
move = "cut"

# The street side: street level a little to one side (as the burst's first view), turned 30 to 36
# degrees towards the shops on the other side, their fronts and signs filling that side of the frame
# while the street leads away on the other (the old view across the street read poorly).
[[shot]]
name = "street side"
size = "close"
move = "cut"
dutch = true

# Above the signs, looking forward. A far view: not for the climax.
[[shot]]
name = "high"
size = "wide"
move = "cut"
tiers = ["quiet", "normal"]

# High over the city, looking down. Not for the climax either.
[[shot]]
name = "overview"
size = "wide"
move = "cut"
tiers = ["quiet", "normal"]

# The burst before a section that lifts, a cut on each of its last four beats, each to a new place
# along the street: street level looking ahead, close on a subject put there for it (a torii over
# the street, a bicycle, a traffic light, a street lamp, vending machines or a little shrine, by the
# shot's seed), closer on another of a different kind, and high up looking down the street (the shot
# beside a shop front became the first subject). (update.wgsl's cut() frames them, shot.index 4 to
# 7.)
[[burst]]
name = "street level"
size = "medium"

[[burst]]
name = "close on a subject"
size = "close"

[[burst]]
name = "close on a subject"
size = "detail"

[[burst]]
name = "high, down the street"
size = "top"

# The looks: the street at night in grey, and in the theme colour (grade.wgsl draws both and
# blends them). The runtime picks the look at a section start by the section's energy: grey in
# quiet and ordinary sections, the theme colour at the climax.
[[look]]
name = "grey"
tags = ["night"]
tiers = ["quiet", "normal"]

[[look]]
name = "theme colour"
tags = ["colour"]
tiers = ["high"]
opens = false

[state]
file = "state.wgsl"
update = "update.wgsl"

[[asset]]
id = "glyphs"
file = "assets/glyphs.png"
linear = true
source = "Rendered by tools/make_glyphs.py from Noto Sans JP, Dela Gothic One, Reggae One, Rampart One, RocknRoll One, Zen Antique, Yusei Magic and DotGothic16 (all SIL Open Font License 1.1: assets/OFL.txt and assets/OFL-*.txt)"

# The street is drawn at 0.75 of the screen's size and scaled up: about 1.75 times as fast.
[render]
scale = 0.75

# What each pixel's ray meets first (hit.wgsl), exactly, for street.wgsl to draw: in two passes a
# phone's GPU keeps more pixels in flight than in one.
[[buffer]]
id = "seen"
format = "rgba32float"

[[buffer]]
id = "street"

[[buffer]]
id = "inked"

[[buffer]]
id = "trail"
persistent = true

[[pass]]
shader = "hit.wgsl"
target = "seen"

[[pass]]
shader = "street.wgsl"
target = "street"
inputs = ["seen"]

[[pass]]
shader = "ink.wgsl"
target = "inked"
inputs = ["street"]

[[pass]]
shader = "compose.wgsl"
target = "trail"
inputs = ["inked", "prev:trail"]

[[pass]]
shader = "grade.wgsl"
target = "out"
inputs = ["trail"]

[post]
exposure = 0.0
bloom = { intensity = 0.55, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.035
chromatic = 0.0012
vignette = 0.45
contrast = 1.22
saturation = 1.05

# ---- What the music drives ----
# The scene says what it wants from the music and the runtime works it out (see "Bindings" in the
# runtime's docs/music.md); the shaders read the values as `input.<id>`, never `music.*`. The
# events the scene only needs to know of arrive as one-frame pulses (release 0); the envelopes
# whose time the scene sets (`kick_decay`, `shake_decay`) are made by the runtime. The signals the
# scene only measures come through as they are (an unclamped `follow`).

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "tick"
label = "A followed beat"

[[input]]
id = "cue_mid"
label = "A cue of at least half strength"

[[input]]
id = "beat_no"
label = "The number of the beat or hit, counted on and on"
range = [0.0, 1000000.0]

[[input]]
id = "signal"
label = "The traffic lights, changing every four bars"

[[input]]
id = "kick_env"
label = "The kick of a beat, dying away as `kick_decay` says"

[[input]]
id = "kick_soft"
label = "The kick between beats, while the beat is followed"

[[input]]
id = "lift_env"
label = "The shake of a lift, dying away as `shake_decay` says"

[[input]]
id = "impact_env"
label = "The shake of an impact, dying away as `shake_decay` says"

[[input]]
id = "label"
label = "The kind of section"
range = [-1.0, 1000.0]

[[input]]
id = "section"
label = "Which section, counted (every section its own number)"
range = [0.0, 1000000.0]

[[input]]
id = "tempo"
label = "The tempo"
range = [0.0, 1000.0]

[[input]]
id = "meter"
label = "Beats to the bar"
range = [0.0, 64.0]

[[input]]
id = "drive"
label = "Slow energy"

[[input]]
id = "next_energy"
label = "The energy of the next section"

[[input]]
id = "intensity"
label = "Fast energy"

[[input]]
id = "energy"
label = "The energy of the moment, spread over the whole range"

[[input]]
id = "audible"
label = "How much is heard (falling with a fade, 0 in silence)"
rest = 1.0

[[input]]
id = "cue_in"
label = "Seconds to the next section (-1: unknown)"
range = [-1.0, 1000.0]
rest = -1.0

[[input]]
id = "band_low"
label = "The bass level"
range = [0.0, 100.0]

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tick"
source = "beats"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "cue_mid"
source = "cues"
how = "trigger"
when = { strength = 0.5, scale = false, release = 0.0 }

[[bind]]
target = "beat_no"
source = "hits"
how = "accumulate"
when = { per = "event" }

[[bind]]
target = "signal"
source = "clock"
how = "step"
ease = "none"
when = { every = 4, unit = "bar", wrap = 2 }

[[bind]]
target = "kick_env"
source = "hits"
how = "trigger"
when = { scale = false, decay = "exp", release = { param = "kick_decay" }, per = "second" }

[[bind]]
target = "kick_soft"
source = "low"
how = "follow"
when = { mul = "locked" }

[[bind]]
target = "lift_env"
source = "cues"
how = "trigger"
when = { strength = 0.95, scale = false, decay = "exp", release = { param = "shake_decay" }, per = "second", decay_from = "event" }

[[bind]]
target = "impact_env"
source = "impacts"
how = "trigger"
when = { decay = "exp", release = { param = "shake_decay" }, per = "second", decay_from = "event" }

[[bind]]
target = "label"
source = "section_label"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "section"
source = "section"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "meter"
source = "meter"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "drive"
source = "drive"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "next_energy"
source = "next_energy"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "intensity"
source = "intensity"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# The energy of the moment, its usual span spread over the whole range (as Torii Sea's): the glide
# is slow in a quiet passage. And how much is heard, smoothed over half a beat: a fade slows the
# glide and silence nearly stills it.
[[bind]]
target = "energy"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 0.5 }

[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5 }

[[bind]]
target = "cue_in"
source = "cue_in"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }
fallback = { value = -1.0 }

[[bind]]
target = "band_low"
source = "band_low"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# ---- Beat ----

[[param]]
id = "hits"
group = "Beat"
label = "Kicks between beats"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "kick_decay"
group = "Beat"
label = "Kick decay"
unit = "s"
default = 0.15
min = 0.04
max = 0.6
step = 0.01

[[param]]
id = "shake"
group = "Beat"
label = "Shake"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "shake_energy"
group = "Beat"
label = "Shake follows loudness"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[param]]
id = "shake_decay"
group = "Beat"
label = "How long a shake lasts"
unit = "s"
default = 0.35
min = 0.05
max = 1.5
step = 0.05

[[param]]
id = "pump"
group = "Beat"
label = "Brightness on the kick"
default = 0.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "zoom"
group = "Beat"
label = "Zoom on the kick"
default = 0.0
min = 0.0
max = 0.2
step = 0.005

# ---- Camera ----

[[param]]
id = "cruise"
group = "Camera"
label = "Speed down low (3 m and under) for music of middling pace (half when quiet, 1.3 times when loud; slower in a fade and in silence)"
unit = "m/s"
default = 4.2
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "cruise_high"
group = "Camera"
label = "Speed up high (45 m) for music of middling pace (0.6 times when quiet, 1.1 times when loud); between the two by the height"
unit = "m/s"
default = 2.5
min = 0.0
max = 15.0
step = 0.1

[[param]]
id = "energy_speed"
group = "Camera"
label = "Energy on the speed (0 none; 1 down low half speed when quiet and 1.3 times when loud, up high 0.6 to 1.1 times)"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "push"
group = "Camera"
label = "Push on the beat (down low; a third of it up high)"
unit = "m/s"
default = 0.9
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "ease"
group = "Camera"
label = "Back to cruise"
unit = "s"
default = 0.5
min = 0.05
max = 2.0
step = 0.05

[[param]]
id = "accel"
group = "Camera"
label = "Smoothness"
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "build_bars"
group = "Camera"
label = "Build-up bars"
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "build"
group = "Camera"
label = "Push in before a louder section"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

# ---- Hard cuts ----

[[param]]
