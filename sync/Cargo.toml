[package]
name = "sync"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sync"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
blake3 = "=1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
serde_json = "1.0.140"
chrono = "0.4.40"
async-trait = "0.1.88"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.16.0", features = ["v4"] }

[lints]
workspace = true
