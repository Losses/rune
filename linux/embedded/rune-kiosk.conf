# Settings of rune-kiosk.service, installed as /etc/rune-kiosk.conf. The
# installer writes it only when it is missing, so changes here stay when the
# kiosk is installed again.

# Text box cursors blink instead of fading. A fading cursor makes the app draw
# a frame at every vsync while a text box has focus. flutter-pi passes no
# arguments to the app, so the switch comes in this variable (--blink-cursor
# elsewhere). Remove the line for the fading cursor.
RUNE_BLINK_CURSOR=1

# Seconds without a touch after which the display goes off. Flutter is told the
# app is paused, so it draws nothing, and the backend keeps playing. While the
# display is off a double tap switches it on; that tap and any other touch are
# not passed on to the app. 0 keeps the display on. Remove the line to leave the
# display's power alone.
RUNE_BLANK_AFTER=60

# The settings below change the machine while the kiosk runs, and each is put
# back when the kiosk stops. Left out, as here, a setting takes the value
# measured for the machine's chip, which the device tree names: see
# /opt/rune-embedded/soc. A chip with no profile there is left alone. Give a
# value to use it instead, or an empty value to leave that part of the machine
# alone on any chip.

# The GPU's devfreq device, a directory under /sys/class/devfreq, with the
# governor and the minimum frequency in Hz it runs with.
#RUNE_GPU_DEVFREQ=
#RUNE_GPU_GOVERNOR=
#RUNE_GPU_MIN_FREQ=

# The frequency in kHz that no CPU goes above. Work that fills the CPU, such as
# scanning or analysing a library, takes longer under a limit.
#RUNE_CPU_MAX_FREQ=

# Controllers to unbind from their drivers, as <platform driver>/<device> under
# /sys/bus/platform/drivers, separated by spaces. Which controllers have
# nothing wired to them depends on the board, so no chip profile sets this. A
# controller with a network link up or a USB device plugged in when the kiosk
# starts stays on; one that is unbound does not see a device plugged in later.
# A device tree overlay keeps such controllers off more thoroughly:
# documents/embedded-power.md.
#RUNE_UNUSED_DEVICES=
