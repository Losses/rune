format = 1
name = "Emoji Tunnel"
license = "MPL-2.0"
description = "Flying down a tunnel of light past emoji (or, by a switch, lacquered tortoiseshell badges printed with family crests in gold leaf)"

common = ["badge.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md): all of
# them. The transitions are the three dressings of a cut (flash, glitch, mosaic) and the ones for
# switching in; the lens effects are the flare, the leak and the glitch, and no mosaic over the
# picture. A cut the camera glides to gets no dressing and only a light lens effect (the flare or
# the leak); a hard cut (the start of a climax, the burst's cuts and the cut after it) takes a
# strong transition; switching into the scene may take any of them, by the runtime's choice.
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "dissolve", "cutin", "flash", "glitch", "mosaic"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare", "leak", "glitch"]

# The looks (tunnel.wgsl grades the picture by them and blends them; the runtime picks one at a
# section start by the section's energy): the tunnel in grey, a little dim, with a faint tint of the
# theme colour, at quiet and ordinary sections, and in the theme colour at the climax. The whole
# picture is one colour family, as CRT Wall's and Neon Street's are, except the emoji, which are
# never recoloured.
[[look]]
name = "grey"
tags = ["night"]
tiers = ["quiet", "normal"]

[[look]]
name = "theme colour"
tags = ["colour"]
tiers = ["high"]
opens = false
# A song with no high section would stay grey throughout: it is promised the look once, in its
# highest section then.
at_least_once = true

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel,
# 0.5 a quarter of them.
[render]
scale = 0.75

[[asset]]
id = "emoji"
file = "assets/emoji.png"
source = "Twemoji 17.0.3 (the jdecked fork), graphics by Twitter, Inc and other contributors, licensed under CC-BY 4.0: https://creativecommons.org/licenses/by/4.0/ (source: https://github.com/jdecked/twemoji). Changed: resized and packed into an atlas."

[[asset]]
id = "crests"
file = "assets/crests.png"
# Data, not colour: each crest's signed distance field.
linear = true
# Drawn for the scene by tools/make_crests.py (no source to credit: the About page lists only
# the assets that say where they come from).

# The camera glides between six places to film from, in the order update.wgsl takes them; the burst
# below adds four more. Which the director picks for a section follows its energy (`tiers`): the
# quiet ones get the wide and the long lens, the high ones the low, across and rolled views, and
# each tier has a shot that may open it (the middle; low as well for the ordinary and high ones). It
# never opens a section looking back.
[camera]
dutch = 0.35
# The shortest shot is eight seconds, so that a glide (at most half a shot) has four seconds at least.
hold = 8.0

# Down the middle: every tier, and it opens (a wide shot does by default).
[[shot]]
name = "middle"
size = "wide"
move = "glide"

# Low, looking up, the emoji going by overhead.
[[shot]]
name = "low"
size = "medium"
move = "glide"
tiers = ["normal", "high"]
opens = true

# From one side, looking across.
[[shot]]
name = "across"
size = "medium"
move = "glide"
tiers = ["normal", "high"]

# Turned a quarter radian off the way, rolled hard, so the core sits off centre and the picture
# leans; the director's tilt comes on top.
[[shot]]
name = "rolled"
size = "medium"
move = "glide"
tiers = ["high"]

# A long lens, the emoji stacked one behind another.
[[shot]]
name = "long lens"
size = "close"
move = "glide"
tiers = ["quiet", "normal"]

# Turned round, the emoji going away into the dark; not for the start of a section.
[[shot]]
name = "looking back"
size = "wide"
move = "glide"
tiers = ["quiet", "normal"]
opens = false

# The burst before a section that lifts: a cut on each of the last four beats, each a close-up of
# another emoji (a badge, where the content is badges) that the scene chooses from the tunnel's own
# at the cut and carries in front of the camera, so that the tunnel rushes past it (a few close-ups
# of emoji of all kinds). update.wgsl's `choose_hero` and `BURST_LOOK` make them (shot.index 6 to 9,
# `shot.fill` 1 to 4). Each cut is a hard one (`shot.hard`), as is the cut after the burst. Face on,
# the camera turned 35 degrees off the tunnel's way, the core well to one side.
[[burst]]
name = "face on"
size = "close"

# Across the tunnel, the things sweeping sideways past it; the emoji turned about 60 degrees, so
# that its cut edge and its face both show.
[[burst]]
name = "from the side"
size = "close"

# From below, steeply up towards the ceiling, things streaming down past it.
[[burst]]
name = "from below"
size = "close"

# The emoji filling the picture, the camera turned round, the tunnel going away behind it.
[[burst]]
name = "filling the picture"
size = "detail"

[[pass]]
shader = "tunnel.wgsl"
target = "out"

# Kept dark: it is watched mostly at night.
[post]
exposure = -0.3
bloom = { intensity = 0.4, threshold = 1.2, radius = 0.7 }
tonemap = "agx"
grain = 0.02
chromatic = 0.001
vignette = 0.35
contrast = 1.1
saturation = 1.3


# ---- What the music drives ----
# Everything the scene hears comes in through these (see "Bindings" in the runtime's docs/music.md).

# A heard hit (at level A each beat followed): the scene counts them itself, at most one in half a
# beat and only while something is heard (see update.wgsl), since at levels B and C a hit is every
# onset and can be dense.
[[input]]
id = "hit"
label = "A hit, or a beat where one is followed"

[[input]]
id = "note"
label = "A melody note, as strong as it is"

# A bar line, where the beat is followed (level A): a bar's first beat starts moves a little more
# often than the others. At levels B and C there is none.
[[input]]
id = "bar_line"
label = "A bar line, where a beat is followed"

[[input]]
id = "audible"
label = "How much is heard (falls with a fade, 0 in silence)"

[[input]]
id = "energy"
label = "The energy of the moment, spread over the whole range and eased over a second (0 to 1)"
rest = 0.5

[[input]]
id = "flight"
label = "How fast it flies, in metres a second: `per_beat` metres a beat at the tempo, slowing with a fade and nil in silence"
range = [0.0, 200.0]

[[input]]
id = "crowd_by_energy"
label = "How many emoji the section's energy calls for, a quarter to all"
range = [0.25, 1.0]

# The tempo and the beats to the bar stay as they are: the shaders need the length of a bar in
# seconds, `meter * 60 / tempo`, and a bind cannot divide by a source.
[[input]]
id = "tempo"
label = "The tempo, in beats a minute"
range = [0.0, 1000.0]

[[input]]
id = "meter"
label = "Beats to the bar"
range = [0.0, 64.0]


[[bind]]
target = "hit"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "note"
source = "notes"
how = "trigger"
when = { release = 0.0 }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "meter"
source = "meter"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# How much is heard, eased over half a second so that whatever goes by it slows with a song's own
# fade. The flight and everything that moves (the phase in `state`) go by it, and the counted hits
# only count while it is above 0.3.
[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5, per = "second" }

# The energy of the moment: `intensity` sits between about 0.2 and 0.85, so it is spread over 0 to 1
# first, and eased over a second so that nothing follows it as a pulse. The flight's speed and the
# core's light follow it (as Neon Street's signs and CRT Wall's screens do).
[[bind]]
target = "energy"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 1.0, per = "second" }

# The flight, per_beat metres a beat of the tempo (60 beats a minute is per_beat metres a second),
# times how much is heard: the slowing with a fade, and nothing in silence, are said here.
[[bind]]
target = "flight"
source = "tempo"
how = "follow"
when = { clamp = false, mul = "input:audible", from = [0.0, 60.0], to = [0.0, { param = "per_beat" }] }

# The slow energy (the section's, in its last four bars turning to the next one's) as the share of
# emoji it calls for: a quarter when quiet, all when loud.
[[bind]]
target = "crowd_by_energy"
source = "drive"
how = "follow"
when = { to = [0.25, 1.0] }


# ---- Beat ----

[[param]]
id = "per_beat"
group = "Beat"
label = "How far it flies a beat"
unit = "m"
default = 6.0
min = 1.0
max = 20.0
step = 0.5

[[param]]
id = "energy_speed"
group = "Beat"
label = "Energy on the flight's speed (1 is 0.6 to 1.4 times, 0 none)"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "surge"
group = "Beat"
label = "Surge forward on each counted beat"
default = 0.6
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "content"
type = "choice"
group = "Badges"
label = "What flies past"
default = 0
options = ["Emoji", "Badges with crests"]

[[param]]
id = "spin"
group = "Badges"
label = "How fast the emoji turn"
unit = "rad/s"
default = 0.8
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "rock"
group = "Badges"
label = "How much further the emoji turn on each counted beat"
unit = "rad"
default = 0.35
min = 0.0
max = 1.2
step = 0.05

[[param]]
id = "dance"
group = "Badges"
label = "How many emoji start a move on each counted beat, at full energy (a third as many when it is low, half as many again on a bar's first beat; each its own way: swelling, spinning, flipping either way, hopping, rocking)"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "melody"
group = "Badges"
label = "How many more emoji move on each note while the melody is busy (the busier it is the more; the beat is the base, the melody adds a few)"
default = 0.15
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "move_time"
group = "Badges"
label = "How long a move takes"
unit = "s"
default = 0.6
min = 0.2
max = 2.0
step = 0.05

[[param]]
id = "badges"
group = "Badges"
label = "How many badges (or emoji)"
default = 0.75
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "crowd"
group = "Badges"
label = "How far the number follows the music (the section's energy, more while the melody is busy; 0 for a fixed number)"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "badge_size"
group = "Badges"
label = "Badge (or emoji) size"
default = 1.4
min = 0.3
max = 2.5
step = 0.05

[[param]]
id = "tumble"
group = "Badges"
label = "Share of badges tumbling over (badges only)"
default = 0.25
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "cubes"
group = "Badges"
label = "How many flakes of leaf"
default = 0.4
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "sparks"
group = "Badges"
label = "How many sparkles"
default = 0.5
min = 0.0
max = 0.8
step = 0.01

# ---- Tunnel ----

[[param]]
id = "inner"
group = "Tunnel"
label = "Clear radius down the middle"
unit = "m"
default = 1.6
min = 0.5
max = 5.0
step = 0.1

[[param]]
id = "outer"
group = "Tunnel"
label = "How far out the badges reach"
unit = "m"
default = 8.0
min = 3.0
max = 20.0
step = 0.5

[[param]]
id = "core"
group = "Tunnel"
label = "The core's light (brighter with the energy, 0.75 to 1.25 times)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "lines"
group = "Tunnel"
label = "How many speed lines"
default = 0.2
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "lights"
group = "Tunnel"
label = "Small points of light flying past, at most this many a slot of tunnel, fewer in a quiet section (the lens flare streaks them)"
default = 0.25
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "glints"
group = "Tunnel"
label = "Glints round the middle"
default = 0.25
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "clouds"
group = "Tunnel"
label = "The haze"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Camera ----

[[param]]
id = "player_colour"
type = "bool"
group = "Colour"
label = "The looks' colour follows the player's theme colour (the system's accent, the chosen colour or the cover's), else the colour below (the emoji are not touched)"
default = true

[[param]]
id = "tint"
type = "color"
group = "Colour"
label = "The colour when not following (and in the scene lab)"
default = "#6a7cf0"

[[param]]
id = "focal"
group = "Camera"
label = "Focal length (smaller is wider)"
default = 0.65
min = 0.35
max = 1.5
step = 0.05

[[param]]
id = "glide_bars"
group = "Camera"
label = "Bars the glide to the next place takes"
default = 4.0
min = 1.0
max = 8.0
step = 0.5

[[param]]
id = "drift"
group = "Camera"
label = "How far the camera drifts while it stays (0 still; still in silence too)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05
