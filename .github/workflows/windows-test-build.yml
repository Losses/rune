name: Windows Test Build (x64 & ARM64)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'

jobs:
  # Resolve the dispatch input into a concrete build matrix so that an
  # unselected architecture never creates a job at all (instead of a job that
  # skips every step and reports a misleading green checkmark).
  select-archs:
    name: Select target architectures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set-matrix
        env:
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          x64='{"arch":"x64","runner":"windows-latest","system":"x86_64-windows","rust_target":"x86_64-pc-windows-msvc"}'
          arm64='{"arch":"arm64","runner":"windows-11-arm","system":"aarch64-windows","rust_target":"aarch64-pc-windows-msvc"}'
          case "$ARCH" in
            both)  echo "matrix={\"include\":[$x64,$arm64]}" >> "$GITHUB_OUTPUT" ;;
            x64)   echo "matrix={\"include\":[$x64]}" >> "$GITHUB_OUTPUT" ;;
            arm64) echo "matrix={\"include\":[$arm64]}" >> "$GITHUB_OUTPUT" ;;
          esac

  build-windows:
    needs: select-archs
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-archs.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Windows command monitor
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/test_windows_monitor.ps1

      # 1. Install nova-nix (Native Windows Nix engine)
      - name: Setup nova-nix
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\.nova-nix"
          $zip = "$dest\nova-nix.zip"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Novavero-AI/nova-nix/releases/download/v0.7.0.0/nova-nix-windows-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Remove-Item $zip
          $novaBin = "$dest\nova-nix-windows-x64\bin"
          Add-Content $env:GITHUB_PATH "$novaBin"
          Write-Host "nova-nix installed successfully to $novaBin"

      # 2. Nix Store Cache (C:\nix\store)
      - name: Cache Nix Store
        uses: actions/cache@v4
        with:
          path: C:\nix\store
          key: nova-nix-store-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('nix/platforms/windows/**', 'windows.nix') }}
          restore-keys: |
            nova-nix-store-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-
            nova-nix-store-${{ runner.os }}-${{ runner.arch }}-

      # 3. Flutter Pub Dependencies Cache
      - name: Cache Flutter Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      # 4. Cargo registry and git cache
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('native/**/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ matrix.arch }}-
            cargo-deps-${{ runner.os }}-

      # 5. Evaluate and verify Windows platform derivations with nova-nix
      - name: Evaluate Platform Nix Derivations
        shell: pwsh
        run: |
          nova-nix eval windows.nix
          nova-nix eval --expr '(import ./nix/platforms/windows/default.nix { system = "${{ matrix.system }}"; }).devShells.default.name'

      # 6. Build all toolchains from Nix store via nova-nix
      #    (Rust and Flutter now come from Nix, replacing external actions)
      - name: Realize Toolchains from Nix Store
        shell: pwsh
        run: |
          # nova-nix v0.7.0.0's `build` only accepts a .nix file as its target
          # (`--expr` exists for `eval` only), so wrap the attribute paths in files.
          #
          # Helper: build a .nix attr file and return the store path.
          # On failure, prints the FULL nova-nix output before throwing.
          function Get-NixStorePath {
            param([string]$AttrFile, [string]$Label)
            $out = nova-nix build $AttrFile 2>&1
            $path = $out | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
            if (-not $path) {
              Write-Host "=== nova-nix build $AttrFile ($Label) FULL OUTPUT ==="
              $out | ForEach-Object { Write-Host $_ }
              throw "nova-nix build did not report a store path for $Label (see output above)"
            }
            Write-Host "$Label in Nix store: $path"
            return $path
          }

          Set-Content -Path ".\cmake-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).tools.cmake"
          Set-Content -Path ".\ninja-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).tools.ninja"
          $cmakeOut = Get-NixStorePath -AttrFile ".\cmake-attr.nix" -Label "CMake"
          $ninjaOut = Get-NixStorePath -AttrFile ".\ninja-attr.nix" -Label "Ninja"
          Add-Content $env:GITHUB_PATH "$cmakeOut\bin"
          Add-Content $env:GITHUB_PATH "$ninjaOut"

          # Fail fast on immutable Flutter integration before realizing Rust.
          Set-Content -Path ".\flutter-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"${{ matrix.system }}`"; }).flutter.package"
          $flutterOut = Get-NixStorePath -AttrFile ".\flutter-attr.nix" -Label "Flutter"
          Add-Content $env:GITHUB_PATH "$flutterOut\flutter\bin"
          ./scripts/test_windows_flutter.ps1 -Package $flutterOut

          # Build Rust toolchain (x64 host via tar.xz derivation; aarch64
          # binaries cannot run on x64).  The derivation fetches the
          # standalone tar.xz, extracts it with tar.exe, and xcopies
          # rust-std-<target>/ into rustc/ — all inside the sandbox.  The
          # output is the fully assembled toolchain store path.  No msiexec
          # needed; two bin dirs (rustc/bin + cargo/bin) both go on PATH.
          #
          # The standalone tarball ships rustc and cargo in SEPARATE
          # top-level dirs (not the merged flat layout of rustup) so BOTH
          # must appear on PATH for cargo to locate rustc.
          Set-Content -Path ".\rust-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).rust.package"
          $rustOut = Get-NixStorePath -AttrFile ".\rust-attr.nix" -Label "Rust"
          Write-Host "Rust toolchain in Nix store: $rustOut"
          $rustcBin = "$rustOut\rustc\bin"
          $cargoBin = "$rustOut\cargo\bin"
          if (-not (Test-Path "$rustcBin\rustc.exe")) { throw "rustc.exe not found at $rustcBin" }
          if (-not (Test-Path "$cargoBin\cargo.exe")) { throw "cargo.exe not found at $cargoBin" }
          $env:PATH = "$cargoBin;$rustcBin;" + $env:PATH
          Write-Host "Rust bin dirs added to PATH: $cargoBin; $rustcBin"

          # ARM64 cross-compile: the x64 tar.xz ships only the x86_64 std
          # (the aarch64 tar.xz has aarch64 binaries that cannot run here).
          # Fetch the aarch64 std component tarball (same pinned 1.99.0) and
          # drop its lib/rustlib/aarch64-pc-windows-msvc into the sysroot so
          # that `cargo build --target aarch64-pc-windows-msvc` finds rlibs.
          if ("${{ matrix.arch }}" -eq "arm64") {
            Write-Host "Fetching aarch64-pc-windows-msvc std for cross-compile..."
            $stdArchive = "$env:RUNNER_TEMP\rust-std-aarch64.tar.xz"
            $stdExtract = "$env:RUNNER_TEMP\rust-std-aarch64"
            Invoke-WebRequest -Uri "https://static.rust-lang.org/dist/rust-std-1.99.0-aarch64-pc-windows-msvc.tar.xz" -OutFile $stdArchive
            New-Item -ItemType Directory -Force -Path "$stdExtract" | Out-Null
            tar.exe -xf $stdArchive -C "$stdExtract"
            if ($LASTEXITCODE -ne 0) { throw "tar.exe failed to extract aarch64 std tarball" }
            $stdTarget = Get-ChildItem -Recurse -Path "$stdExtract" -Directory -Filter "aarch64-pc-windows-msvc" | Select-Object -First 1
            if (-not $stdTarget) { throw "aarch64-pc-windows-msvc dir not found in std tarball" }
            # After the xcopy merge in the derivation, target std lives under
            # rustc\lib\rustlib (alongside the x64 std).  Drop the aarch64
            # std next to it.
            $destDir = "$rustOut\rustc\lib\rustlib\aarch64-pc-windows-msvc"
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Recurse -Force "$($stdTarget.FullName)\*" "$destDir\"
            Write-Host "Installed aarch64 std to: $destDir"
          }

          # Publish the Rust bin dirs for downstream steps.  Two entries:
          # cargo/bin and rustc/bin (the standalone tarball keeps them
          # separate).  cargo resolves rustc from PATH.
          Add-Content $env:GITHUB_PATH "$cargoBin"
          Add-Content $env:GITHUB_PATH "$rustcBin"

          # Inno Setup: fetchurl the verified installer .exe from Nix store,
          # then silent-install it for both target architectures.
          Set-Content -Path ".\inno-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).innosetup.package"
          $innoExe = Get-NixStorePath -AttrFile ".\inno-attr.nix" -Label "Inno Setup"
          $innoOut = "$env:RUNNER_TEMP\inno-setup"
          New-Item -ItemType Directory -Force -Path "$innoOut" | Out-Null
          Write-Host "Installing Inno Setup from: $innoExe"
          $proc = Start-Process -FilePath $innoExe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$innoOut`"" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Inno Setup silent install failed (exit $($proc.ExitCode)) on $innoExe" }
          $iscc = Join-Path $innoOut "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found under $innoOut after Inno Setup install" }
          Write-Host "Inno Setup installed to: $innoOut"
          Add-Content $env:GITHUB_PATH "$innoOut"

      # 8. Build rinf CLI from Nix store (source-build via hash-verified .crate)
      #    Replaces the previous `cargo install rinf_cli` so the binary is
      #    reproducible and pinned.  The derivation fetches the .crate, unpacks
      #    it, and runs cargo install --path --locked inside the sandbox.
      - name: Build Rinf CLI from Nix Store
        shell: pwsh
        run: |
          Set-Content -Path ".\rinf-attr.nix" -Value "(import ./nix/platforms/windows/default.nix { system = `"x86_64-windows`"; }).rinf.package"
          $out = nova-nix build .\rinf-attr.nix 2>&1
          $rinfPath = $out | Where-Object { $_ -match '^C:\\nix\\store\\' } | Select-Object -Last 1
          if (-not $rinfPath) {
            Write-Host "=== nova-nix build rinf FULL OUTPUT ==="
            $out | ForEach-Object { Write-Host $_ }
            throw "nova-nix build did not report a store path for rinf (see output above)"
          }
          Write-Host "Rinf in Nix store: $rinfPath"
          Add-Content $env:GITHUB_PATH "$rinfPath\bin"

      # 9. Run One-Click Windows Build (MSVC + CargoKit Shim + Runner + Inno Setup)
      - name: Run Windows One-Click Build
        # Stage maxima total 125 minutes; leave cleanup and artifact upload room.
        timeout-minutes: 135
        shell: pwsh
        run: |
          .\scripts\windows_build.ps1 -Arch ${{ matrix.arch }} -BuildInstaller

      - name: Upload Windows diagnostics and Cargo timings
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            build/diagnostics/
            target/cargo-timings/
            target/**/cargo-timings/
          if-no-files-found: warn

      # Match build.yml: upload the complete runner before MSIX adds packaging files.
      - name: Compute artifact identity
        id: artifact
        shell: pwsh
        run: |
          $safeRef = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "prefix=Rune-$safeRef-$shortSha-windows" >> $env:GITHUB_OUTPUT

      - name: Upload Portable Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.prefix }}-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/runner/Release/
          if-no-files-found: error

      - name: Build MSIX from existing application
        shell: pwsh
        timeout-minutes: 15
        run: |
          # msix 3.16.12: configuration.dart defines both options; no second Flutter build.
          dart run msix:create --release --build-windows false --architecture ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed (exit $LASTEXITCODE)" }
          ./scripts/test_windows_msix.ps1 -Arch ${{ matrix.arch }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.prefix }}-${{ matrix.arch }}-msix
          path: build/windows/${{ matrix.arch }}/runner/Release/rune.msix
          if-no-files-found: error

      # Retain the direct-install Inno package alongside the reference MSIX output.
      - name: Upload Inno Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.prefix }}-${{ matrix.arch }}-installer
          path: Output/Rune-${{ matrix.arch }}-Setup.exe
          if-no-files-found: error
