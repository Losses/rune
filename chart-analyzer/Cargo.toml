[package]
name = "chart_analyzer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "chart_analyzer"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
fsio = { path = "../fsio" }
fsio_media_source = { path = "../fsio-media-source" }
realfft = "3.4.0"
rubato = "0.16.1"
serde = { version = "1.0.219", features = ["derive"] }
# The same decoders the player has: all of Symphonia's, with its AAC and Opus ones swapped for
# FDK-AAC and libopus by `fsio_media_source::get_codecs`.
symphonia = { version = "0.5.4", features = ["all-codecs", "all-formats"] }

[dev-dependencies]
serde_json = "1.0.140"
