default = 2.0
min = 0.0
max = 10.0
step = 0.5

[[param]]
id = "far"
group = "Camera"
label = "Weight of the far view"
default = 1.0
min = 0.0
max = 10.0
step = 0.5

[[param]]
id = "close"
group = "Camera"
label = "Weight of the close view"
default = 0.5
min = 0.0
max = 10.0
step = 0.5

[[param]]
id = "cruise"
group = "Camera"
