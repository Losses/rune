[package]
name = "metadata"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "metadata"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0.61"
lazy_static = "1.5.0"
walkdir = "2.5.0"
log = "0.4.22"
regex = "1.10.6"
anyhow = {version="1.0.98",  features = ["backtrace"] }
image = "0.25.2"
palette_extract = "0.1.0"
fsio = { version = "0.1.0", path = "../fsio" }
tokio = { version = "1", features = ["full"] }
futures = "0.3.30"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.11.0", features = ["serde", "v5"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
media-compute = { path = "../media-compute" }

[build-dependencies]
cmake = "0.1"

[lints]
workspace = true
