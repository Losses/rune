format = 1
name = "Torii Sea"
license = "MPL-2.0"
description = "Endless torii winding over the sea, waves breaking with the music"

common = ["sea.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md): A calm sea:
# a flash that turns the hour, and every lens effect but the light leak (the others are all
# declared).
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "dissolve", "flash"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare", "glitch", "mosaic"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel;
# 0.75 keeps the sea's crosses crosses (at 0.5 they blur into dots; the torii, listed per tile of
# the screen, cost a quarter of what they did, which pays for it); 0.5 a quarter of the pixels,
# 0.35 a little soft, below 0.25 the torii's edges turn to steps.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

[camera]
dutch = 0.3
# A slow flight over the sea: cut less often than an ordinary scene.
pace = "calm"

# Looking down the line from high behind, and from low behind to one side: both see the whole
# line and its sky, so both are wide. Then beside the spirits, flying with them, and ahead of them
# to one side, watching them come on (from behind they are only the ends of their trails).
[[shot]]
name = "high behind"
size = "wide"
move = "cut"

[[shot]]
name = "low beside"
size = "wide"
move = "cut"

[[shot]]
name = "beside"
size = "close"
move = "cut"
# Picked less often than the wide shots, and never kept long: flying close beside them tires the
# eye.
weight = 0.4
longest = 6.0

[[shot]]
name = "head on"
size = "detail"
move = "cut"
# Picked less often than the wide shots, and never kept long: flying close beside them tires the
# eye.
weight = 0.4
longest = 6.0

# The burst before a section that lifts, a cut on each of its last four beats, each from the
# other side of the line: the formation passing a gate from above behind, right beside the
# spirits' heads, a long lens on their heads from ahead, and high above the winding line.
[[burst]]
name = "above behind"
size = "medium"

[[burst]]
name = "beside the heads"
size = "close"

[[burst]]
name = "heads, long lens"
size = "detail"

[[burst]]
name = "high above"
size = "top"

# The looks: the four lights of the scene (sea.wgsl draws them, as `light_of`; the order is the
# order it takes). The runtime decides when the light changes: a section start picks the look by
# the section's label (the same each time) and fades to it, and the scene's first light is drawn
# from its seed among the looks that open (see "Looks" in the runtime's docs/music.md). The
# spirits' pattern is no look: it stays on `pattern`, picked by the section.
[[look]]
name = "day"
tags = ["day"]
# The scene never starts in daylight, though a section may change to it.
opens = false
# Seen at least once a song: if no section has changed to it by the song's last, that one does.
at_least_once = true

[[look]]
name = "low sun"
tags = ["warm"]

[[look]]
name = "blue hour"
tags = ["night"]

[[look]]
name = "night"
tags = ["night"]

[post]
exposure = 0.0
bloom = { intensity = 0.4, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.03
chromatic = 0.0
vignette = 0.2
contrast = 1.12
saturation = 1.05

# ---- What the music drives ----
# The scene says what it wants from the music and the runtime works it out (see "Bindings" in the
# runtime's docs/music.md); the shaders read the values as `input.<id>`. The events that the scene
# only needs to know of arrive as one-frame pulses (release 0); the envelopes whose time the scene
# or the music sets are made by the runtime. The signals the scene only measures come through as
# they are (an unclamped `follow`), so that a lab can see them and change their source.

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "tick"
label = "A followed beat"

[[input]]
id = "cue"
label = "A cue of at least a faint strength"

[[input]]
id = "bar_line"
label = "A bar line"

[[input]]
id = "lift"
label = "A section that lifts the energy"

[[input]]
id = "impact"
label = "The strength of an impact"

[[input]]
id = "surge_env"
label = "The surge of a beat, dying away as `surge_decay` says"

[[input]]
id = "swell_lift"
label = "The swell of a lift, fading over 3 s"

[[input]]
id = "swell_hit"
label = "The swell of an impact, fading over 3 s"

[[input]]
id = "beat_no"
label = "The number of the beat"
range = [0.0, 1000000.0]

[[input]]
id = "beat_pos"
label = "The beat on the eased clock, each beat pushed on"
range = [0.0, 1000000.0]

[[input]]
id = "clock"
label = "The beat clock"
range = [0.0, 1000000.0]

[[input]]
id = "bar"
label = "The bar"
range = [0.0, 1000000.0]

[[input]]
id = "tempo"
label = "The tempo"
range = [0.0, 1000.0]

[[input]]
id = "pace"
label = "The tempo against 90 bpm"
range = [0.0, 1000.0]

[[input]]
id = "meter"
label = "Beats to the bar (at least 1)"
range = [1.0, 64.0]

[[input]]
id = "locked"
label = "How much the beat is followed"

[[input]]
id = "more_spirits"
label = "How many more spirits than the pattern has, by the slow energy (-1 to 1)"
range = [-1.0, 1.0]
rest = 0.0

[[input]]
id = "bloom"
label = "The bloom's intensity, rising with the slow energy"
range = [0.0, 3.0]

[[input]]
id = "kick"
label = "The kick, only while the beat is followed, as much as `hits` lets through"

[[input]]
id = "snare_hit"
label = "A snare hit (the snare past 0.7)"

[[input]]
id = "band_low"
label = "The bass level"
range = [0.0, 100.0]

[[input]]
id = "band_mid"
label = "The mids level"
range = [0.0, 100.0]

[[input]]
id = "band_high"
label = "The treble level"
range = [0.0, 100.0]

[[input]]
id = "wave"
label = "The sea's energy, swelling slowly"

[[input]]
id = "energy"
label = "The energy of the moment, spread over the whole range"

[[input]]
id = "audible"
label = "How much is heard (falling with a fade, 0 in silence)"
rest = 1.0

[[input]]
id = "pattern"
label = "The spirits' pattern, by section (-1: none)"
range = [-1.0, 4.0]
rest = -1.0

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "tick"
source = "beats"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "cue"
source = "cues"
how = "trigger"
when = { strength = 0.2, scale = false, release = 0.0 }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "lift"
source = "cues"
how = "trigger"
when = { strength = 0.99, scale = false, release = 0.0 }

[[bind]]
target = "impact"
source = "impacts"
how = "trigger"
when = { release = 0.0 }

[[bind]]
target = "surge_env"
source = "hits"
how = "trigger"
when = { scale = false, decay = "exp", release = { param = "surge_decay" }, per = "second", decay_from = "event" }

[[bind]]
target = "swell_lift"
source = "cues"
how = "trigger"
when = { strength = 0.99, scale = false, decay = "exp", release = 3.0, per = "second", decay_from = "event" }

[[bind]]
target = "swell_hit"
source = "impacts"
how = "trigger"
when = { decay = "exp", release = 3.0, per = "second", decay_from = "event" }

[[bind]]
target = "beat_no"
source = "clock"
how = "step"
ease = "none"

[[bind]]
target = "beat_pos"
source = "clock"
how = "step"
ease = "out"
when = { ease_power = 4 }

[[bind]]
target = "clock"
source = "clock"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "bar"
source = "bar"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# The tempo against 90 bpm (the flight's `cruise` is the speed at 90).
[[bind]]
target = "pace"
source = "tempo"
how = "follow"
when = { from = [0.0, 90.0], to = [0.0, 1.0], clamp = false }

# At least one beat to the bar, as the shader divides by it.
[[bind]]
target = "meter"
source = "meter"
how = "follow"
when = { from = [1.0, 64.0], to = [1.0, 64.0] }

[[bind]]
target = "locked"
source = "locked"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

# One spirit more for each half of the slow energy over a half, one fewer for each half under it
# (the pattern's own count is the shader's).
[[bind]]
target = "more_spirits"
source = "drive"
how = "follow"
when = { from = [0.5, 1.0], to = [0.0, 1.0], clamp = false }

# The bloom's glow, from 0.6 of `glow` in a quiet passage to 1.1 of it at the top of the energy.
[[bind]]
target = "bloom"
source = "drive"
how = "follow"
when = { to = [{ param = "glow", mul = 0.6 }, { param = "glow", mul = 1.1 }], clamp = false }

# The kick's onsets, as much as `hits` lets through (the beat itself comes as `beat`), and only as
# far as the beat is followed.
[[bind]]
target = "kick"
source = "low"
how = "follow"
when = { to = [0.0, { param = "hits" }], mul = "locked", clamp = false }

# The snare's onsets past 0.7 count as a hit: a trigger takes only an event source and the snare
# is a level (`mid`), so this is a follow that steps from 0 to 1 at 0.7. The flick's latch and its
# fall stay in the shader.
[[bind]]
target = "snare_hit"
source = "mid"
how = "follow"
when = { from = [0.7, 0.7001] }

[[bind]]
target = "band_low"
source = "band_low"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "band_mid"
source = "band_mid"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "band_high"
source = "band_high"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "wave"
source = "drive"
how = "follow"
when = { smooth = 1.0 }

# The energy of the moment, its usual span spread over the whole range (as Growth's `fill`): the
# flight's speed, how freely the spirits move and how brightly the lanterns glow all follow it,
# so a quiet passage is slower, calmer and darker.
[[bind]]
target = "energy"
source = "intensity"
how = "follow"
when = { from = [0.2, 0.85], smooth = 0.5 }

# How much is heard, smoothed over half a beat: a fade slows the flight and calms the spirits,
# and silence nearly stills them.
[[bind]]
target = "audible"
source = "audible"
how = "follow"
when = { smooth = 0.5 }

[[bind]]
target = "pattern"
source = "section_label"
how = "pick"
when = { options = 5 }
fallback = "rest"

