format = 1
name = "Armillary"
license = "MPL-2.0"
description = "An armillary sphere floating in space, its glassy rings each keeping its own time, its core breathing with the music, polygons drawn in lines round it lit by the accents"

common = ["world.wgsl"]

# The effects that suit the scene (see "Shared effects" in the runtime's docs/music.md):
# An instrument of the night sky: a flash like daybreak, and a flare off its bright rings.
[effects]
# Transitions: switching into this scene, and dressing a hard cut of the camera in it.
transitions = ["fade", "dissolve", "flash"]
# Lens effects: over the picture, with no change of picture.
lens = ["flare"]

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after: 1 draws every pixel,
# 0.5 a quarter of them.
[render]
scale = 0.75

[[pass]]
shader = "view.wgsl"
target = "out"

# The camera never rolls of its own accord, so the director's dutch angle is what tilts it.
[camera]
dutch = 0.3

# The four setups, in the order of the "view" parameter. Below and far off frame the whole sphere
# at about the same size (the focal length over the distance), so both are wide; through the rings
# is twice as near; from above is the top view.
[[shot]]
name = "below"
size = "wide"
move = "cut"

[[shot]]
name = "far"
size = "wide"
move = "cut"

[[shot]]
name = "through the rings"
size = "close"
move = "cut"

[[shot]]
name = "above"
size = "top"
move = "cut"

# Kept dark: it is watched mostly at night.
[post]
exposure = -0.2
bloom = { intensity = 0.45, threshold = 1.0, radius = 0.7 }
tonemap = "agx"
grain = 0.02
chromatic = 0.0008
vignette = 0.4
contrast = 1.05
saturation = 1.1


# ---- What the music drives ----
# The scene says what it wants from the music and the runtime works it out (see "Bindings" in the
# runtime's docs/music.md); the shaders read the values as `input.<id>`. The moments (a beat, a bar
# line, a section) arrive as one-frame pulses; the kick's envelope and the paces that sum into the
# ecliptic's precession, the camera's drift, the core's surface and rays and the planet's turn are
# made by the runtime (the sliders `flow` and `drift` are their rates, the angles' constants are
# folded in). The signals the scene only measures come through as they are.

[[input]]
id = "beat"
label = "A beat, or a hit where no beat is followed"

[[input]]
id = "bar_line"
label = "A bar line (only while the beat is followed)"

[[input]]
id = "section"
label = "A cue at least `cue_min` strong"

[[input]]
id = "kick_env"
label = "The kick, dying away over a quarter of a second"

[[input]]
id = "intensity"
label = "Fast energy"

[[input]]
id = "band_low"
label = "The bass level"
range = [0, 100]

[[input]]
id = "band_mid"
label = "The mids level"
range = [0, 100]

[[input]]
id = "band_high"
label = "The treble level"
range = [0, 100]

[[input]]
id = "tempo"
label = "The tempo"
range = [0, 1000]

[[input]]
id = "pace_tempo"
label = "The tempo, held at 40 or more"
range = [40, 1000]

[[input]]
id = "spin_pace"
label = "How fast the ecliptic precesses, with the energy"
range = [-10, 10]

[[input]]
id = "drift_pace"
label = "How fast the camera drifts, with the energy"
range = [-10, 10]

[[input]]
id = "flow_high"
label = "How fast the core flows, with the treble"
range = [0, 10]

[[input]]
id = "flow_mid"
label = "How fast the core's rays turn, with the mids"
range = [0, 10]

[[input]]
id = "planet_pace"
label = "How fast the planet turns, with the energy"
range = [-10, 10]

[[input]]
id = "spin"
label = "The ecliptic's precession, summed"
range = [0, 1000000]

[[input]]
id = "cam_drift"
label = "The camera's drift, summed (starting anew with each shot)"
range = [0, 1000000]

[[input]]
id = "core_flow"
label = "The core's flowing surface, summed"
range = [0, 1000000]

[[input]]
id = "core_rays"
label = "The core's turning rays, summed"
range = [0, 1000000]

[[input]]
id = "planet_turn"
label = "The planet's turn, summed (radians: a turn in 24 beats)"
range = [0, 1000000]

[[bind]]
target = "beat"
source = "hits"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "bar_line"
source = "bars"
how = "trigger"
when = { scale = false, release = 0.0 }

[[bind]]
target = "section"
source = "cues"
how = "trigger"
when = { strength = { param = "cue_min" }, scale = false, release = 0.0 }

[[bind]]
target = "kick_env"
source = "hits"
how = "trigger"
when = { scale = false, decay = "exp", release = 0.25, per = "second", decay_from = "event" }

[[bind]]
target = "intensity"
source = "intensity"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "band_low"
source = "band_low"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "band_mid"
source = "band_mid"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "band_high"
source = "band_high"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "tempo"
source = "tempo"
how = "follow"
when = { clamp = false, to = [0.0, 1.0] }

[[bind]]
target = "pace_tempo"
source = "tempo"
how = "follow"
when = { from = [40.0, 1000.0], to = [40.0, 1000.0] }

[[bind]]
target = "spin_pace"
source = "intensity"
how = "follow"
when = { clamp = false, from = [0.0, 1.0], to = [0.35, 1.6] }

[[bind]]
target = "drift_pace"
source = "intensity"
how = "follow"
when = { clamp = false, from = [0.0, 1.0], to = [0.6, 1.5] }

[[bind]]
target = "flow_high"
source = "band_high"
how = "follow"
when = { from = [0.0, 2.0], to = [0.25, 1.45] }

[[bind]]
target = "flow_mid"
source = "band_mid"
how = "follow"
when = { from = [0.0, 2.0], to = [0.1, 0.9] }

[[bind]]
target = "planet_pace"
source = "intensity"
how = "follow"
when = { clamp = false, from = [0.0, 1.0], to = [0.6, 1.4] }

[[bind]]
target = "spin"
source = "input:spin_pace"
how = "accumulate"
when = { per = "second", rate = { param = "flow", mul = 0.06 } }

[[bind]]
target = "cam_drift"
source = "input:drift_pace"
how = "accumulate"
when = { per = "second", rate = { param = "drift" }, reset = "cut" }

[[bind]]
target = "core_flow"
source = "input:flow_high"
how = "accumulate"
when = { per = "second", rate = { param = "flow" } }

[[bind]]
target = "core_rays"
source = "input:flow_mid"
how = "accumulate"
when = { per = "second", rate = { param = "flow" } }

# A turn is 24 beats of 60 / tempo seconds: 2 pi / 1440 radians a second for each bpm.
[[bind]]
target = "planet_turn"
source = "input:planet_pace"
how = "accumulate"
when = { per = "second", mul = "input:pace_tempo", rate = { param = "flow", mul = 0.0043633231 } }

# ---- Beat ----

[[param]]
id = "motion"
type = "choice"
group = "Beat"
label = "How the rings move"
default = 1
options = ["Free: each always tumbling on its own, pushed to tumble a new way, surging and easing back", "Pendulums: resting in place, swinging or turning a whole turn back to it when pushed"]

[[param]]
id = "ring_spin"
group = "Beat"
label = "Free: how fast the rings tumble of themselves (with the tempo)"
default = 1.0
min = 0.0
max = 4.0
step = 0.05

[[param]]
id = "whirl_time"
group = "Beat"
label = "How long a ring takes over a whole turn (the big ones slower, the small ones quicker)"
unit = "s"
default = 1.6
min = 0.4
max = 4.0
step = 0.1

[[param]]
id = "sway"
group = "Beat"
label = "How hard a ring is pushed each bar (pendulums: how far it swings out; free: six times that further round)"
unit = "°"
default = 8.0
min = 0.0
max = 30.0
step = 1.0

[[param]]
id = "flow"
group = "Beat"
label = "How fast things keep turning and flowing between beats (faster as it is louder)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Colour ----

[[param]]
id = "follow"
type = "bool"
group = "Colour"
label = "Follow the player's theme colour (the system's accent, the chosen colour or the cover's)"
default = true

[[param]]
id = "theme"
type = "color"
group = "Colour"
label = "The theme colour when not following the player; only its hue is taken, and every colour is made from it"
default = "#007aff"

[[param]]
id = "chroma"
group = "Colour"
label = "How colourful (0 is black and white)"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

# ---- Sphere ----

[[param]]
id = "core"
group = "Sphere"
label = "The core's light (brighter as it is louder)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "core_look"
type = "choice"
group = "Sphere"
label = "How the core looks"
default = 5
options = ["As it was: flowing bands of light", "A little star: white-hot middle, darker orange edge, grained surface boiling", "A glass lamp: a small bright light in a clear globe", "A gem: a ball of crystal cut all over, the light inside it, its facets flashing as it turns", "A gem in lines: only its facets' edges, drawn as the rings are, a small light in its heart", "A planet in character art: drawn in . : - + = % * # @ by how bright it is, its markings turning with it"]

[[param]]
id = "core_kick"
group = "Sphere"
label = "How hard the core swells on the kick"
default = 2.5
min = 0.0
max = 8.0
step = 0.1

[[param]]
id = "nebula"
group = "Sphere"
label = "The nebula's brightness"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "latitude"
group = "Sphere"
label = "Latitude (how the pole tips)"
unit = "°"
default = 35.0
min = 0.0
max = 90.0
step = 1.0

[[param]]
id = "look"
type = "choice"
group = "Sphere"
label = "How the rings look"
default = 3
options = ["Glass: clear gold, glowing edges and ticks", "Instrument: dark bronze, lit only by the core", "Lines: fine lines of light, as a star chart", "Marks: strings of dots and crosses, bigger as they are nearer, an accent lighting a ring's dots all together"]

[[param]]
id = "accent"
group = "Sphere"
label = "How strong a beat must be to light (downbeats about 0.55 to 1, weak beats 0.3 to 0.5, stronger when louder)"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "lit_beats"
group = "Sphere"
label = "How many beats a lit ring or shape takes to fade by half"
unit = "beats"
default = 0.5
min = 0.1
max = 4.0
step = 0.05

[[param]]
id = "layer_bars"
type = "int"
group = "Sphere"
label = "Bars before the rings and the shapes swap turns at lighting"
default = 4
min = 1
max = 16
step = 1

[[param]]
id = "renew"
group = "Sphere"
label = "Lines: the chance a ring takes a new tilt as it lights (free motion)"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "tick_spec"
group = "Sphere"
label = "Lines: how far the ecliptic's ticks reach with the spectrum"
unit = "m"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "spec_amp"
group = "Sphere"
label = "Lines: how far the ring drawn as the spectrum reaches out (another ring every four bars)"
unit = "m"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "bead_gap"
group = "Sphere"
label = "Marks: how far apart the dots round a ring are"
unit = "m"
default = 0.13
min = 0.05
max = 0.4
step = 0.01

[[param]]
id = "gap_grow"
group = "Sphere"
label = "Marks: how much further apart the dots are round the outer rings (0 the same)"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[param]]
id = "bead_size"
group = "Sphere"
label = "Marks: how big the dots are"
unit = "m"
default = 0.022
min = 0.005
max = 0.08
step = 0.001

[[param]]
id = "light_reach"
group = "Sphere"
label = "Marks: how much of a ring an accent lights (turns)"
default = 1.0
min = 0.05
max = 1.0
step = 0.05

[[param]]
id = "light_spread"
group = "Sphere"
label = "Marks: beats for a lit ring's dots to brighten, all together (0: at once)"
unit = "beats"
default = 0.5
min = 0.0
max = 4.0
step = 0.25

[[param]]
id = "light_beats"
group = "Sphere"
label = "Marks: beats before a lit ring has dimmed by half"
unit = "beats"
default = 2.0
min = 0.25
max = 8.0
step = 0.25

[[param]]
id = "planet"
group = "Sphere"
label = "The text planet's radius"
unit = "m"
default = 1.0
min = 0.3
max = 1.4
step = 0.05

[[param]]
id = "text_rows"
group = "Sphere"
label = "Rows of characters across the planet"
default = 22.0
min = 8.0
max = 48.0
step = 1.0

[[param]]
id = "ring_glow"
group = "Sphere"
label = "The rings' glowing edges and haze"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Polygons ----

[[param]]
id = "shapes"
group = "Shapes"
label = "How many shapes each accent lights (at most 24 a batch)"
default = 0.75
min = 0.0
max = 1.0
step = 0.01

[[param]]
id = "shape_size"
group = "Shapes"
label = "Shape size"
default = 1.0
min = 0.3
max = 3.0
step = 0.05

[[param]]
id = "shape_glow"
group = "Shapes"
label = "How bright the shapes are"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

# ---- Camera ----

[[param]]
id = "view"
type = "choice"
group = "Camera"
label = "Shot"
default = 0
options = ["Following the music", "From a little below, pushing in", "Far off", "Close, through the rings", "From above"]

[[param]]
id = "lens"
group = "Camera"
label = "How far back, with a longer lens (higher flattens the perspective)"
default = 1.8
min = 0.6
max = 3.0
step = 0.05

[[param]]
id = "drift"
group = "Camera"
label = "How fast the camera pushes in or circles within a shot (0 still)"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "cue_min"
group = "Camera"
label = "How strong a cue must be to fling the rings (1 a section that lifts the energy, 0.5 any other section, 0.3 every 8 bars while the beat is followed, 0.2 every 16 s without a beat)"
default = 0.2
min = 0.1
max = 1.0
step = 0.05
