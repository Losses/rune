[package]
name = "subsonic"
version = "0.1.0"
edition = "2024"

[dependencies]
discovery = { path = "../discovery" }
md5 = "0.7.0"
rand = "0.8.5"
reqwest = { version = "0.12.18", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2"
url = "2.5.4"

[dev-dependencies]
axum = "0.8.1"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
