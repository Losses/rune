format = 1
name = "CRT Wall"
license = "MPL-2.0"
description = "An endless wall of old television sets piled every which way, each flicking to another channel on its own beat"

common = ["wall.wgsl"]
# Covers from the library, for the screens that show one.
covers = true

[state]
file = "state.wgsl"
update = "update.wgsl"

# The whole picture's resolution, per side, stretched to the screen after. 1 draws every pixel;
# for phones 0.6 keeps the scan lines and grilles readable close up, 0.5 softens them.
[render]
scale = 1.0

[[asset]]
id = "plastic"
file = "assets/plastic.png"
# Data, not colour: the normal, how open each spot is and the face's tone.
linear = true
source = "Made by tools/make_textures.py"

# The scopes' trace, small: it is only ever seen on a screen.
[[buffer]]
id = "scope_buf"
scale = 0.3
persistent = true

[[pass]]
shader = "scope.wgsl"
target = "scope_buf"
inputs = ["prev:scope_buf"]

[[pass]]
shader = "view.wgsl"
target = "out"
inputs = ["scope_buf"]

[post]
exposure = 0.0
bloom = { intensity = 0.25, threshold = 1.0, radius = 0.6 }
tonemap = "agx"
grain = 0.025
chromatic = 0.0
vignette = 0.4
contrast = 1.1
saturation = 1.0

# ---- Beat ----

[[param]]
id = "kick_decay"
group = "Beat"
label = "Kick decay"
unit = "s"
default = 0.2
min = 0.04
max = 1.0
step = 0.01

# ---- Screens ----

[[param]]
id = "share"
group = "Screens"
label = "Share of screens changing channel on a beat"
default = 0.25
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "stagger"
group = "Screens"
label = "Most a screen lags the beat (in quarter beats)"
unit = "beats"
default = 0.75
min = 0.0
max = 2.0
step = 0.25

[[param]]
id = "flash"
group = "Screens"
label = "Flash on a change of channel"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "flash_time"
group = "Screens"
label = "How fast the flash fades"
unit = "s"
default = 0.12
min = 0.02
max = 1.0
step = 0.01

[[param]]
id = "react"
group = "Screens"
label = "Share of screens jolted by a beat (snow torn, figures sped)"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "snow"
group = "Screens"
label = "Weight of snow"
default = 1.0
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "scope"
group = "Screens"
label = "Weight of scopes"
default = 0.35
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "cover"
group = "Screens"
label = "Weight of covers"
default = 1.4
min = 0.0
max = 3.0
step = 0.05

[[param]]
id = "now_playing"
group = "Screens"
label = "Share of covers that are the song playing"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "cover_light"
group = "Screens"
label = "Cover brightness"
default = 0.6
min = 0.1
max = 2.0
step = 0.05

[[param]]
id = "group"
group = "Screens"
label = "How much neighbouring screens share a channel"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "off_always"
group = "Screens"
label = "Screens always off"
default = 0.2
min = 0.0
max = 0.8
step = 0.05

[[param]]
id = "off"
group = "Screens"
label = "Screens dark in quiet sections (with a chart)"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[param]]
id = "brightness"
group = "Screens"
label = "Screen brightness"
default = 0.9
min = 0.1
max = 3.0
step = 0.05

[[param]]
id = "persist"
group = "Screens"
label = "Scope persistence"
unit = "s"
default = 0.12
min = 0.01
max = 1.0
step = 0.01

[[param]]
id = "gaps"
group = "Screens"
label = "Empty slots"
default = 0.04
min = 0.0
max = 0.5
step = 0.01

