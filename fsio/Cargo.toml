[package]
name = "fsio"
version = "0.1.0"
edition = "2021"

[lib]
name = "fsio"
path = "src/lib.rs"

[features]
test-fixtures = []

[dependencies]
anyhow = "1.0.98"
log = "0.4.27"
thiserror = "1.0"
walkdir = "2.5.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
dunce = "1.0.5"
serde = { version = "1.0", features = ["derive"] }
opendal = { version = "0.59", default-features = false, features = ["blocking", "services-webdav", "services-s3"] }
opendal-http-transport-reqwest = { version = "0.59", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.23", features = ["ring"], default-features = false }
webpki-roots = "0.26.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
rusqlite = { version = "0.32.0", features = ["bundled"] }
ndk-saf = { git = "https://github.com/Losses/Rust-SAF", version = "0.1.11" }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
