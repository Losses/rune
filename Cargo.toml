# This file is used for telling Rust-related tools
# where various Rust crates are.
# This also unifies `./target` output folder and
# various Rust configurations.

[workspace]
members = ["native/hub", "native/requests", "cli", "tag-editor", "discovery", "sync", "fsio", "fsio-media-source", "playback", "http-request"]
resolver = "2"

[patch.crates-io]
core-graphics = { path = "./core-graphics" }
# Vendored to fix compilation for 32-bit x86 (i686-linux-android):
# `use core::arch::x86_64::*` inside a cfg(any(x86, x86_64)) block.
arroy = { path = "./arroy" }
# Vendored to fix MSVC ARM64 (aarch64-pc-windows-msvc): FDK_archdef.h does not
# recognize _M_ARM64 (VS 18), so the preprocessor falls into the #warning branch
# and MSVC 14.51 promotes #warning to fatal error C1188. Patch adds an _M_ARM64
# architecture case without defining __arm__/__aarch64__ (which would pull in
# GCC-only ARM intrinsics headers).
fdk-aac-sys = { path = "native/fdk-aac-sys" }
