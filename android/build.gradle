allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    // Raise every plugin's compileSdk to the app module's (flutter.compileSdkVersion).
    // AGP 8.13 errors out when a dependency (e.g. androidx.annotation) requires a
    // newer compileSdk than what old plugins declare. The app project is evaluated
    // first thanks to evaluationDependsOn(":app") below.
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            Integer pluginCompileSdk = project.android.compileSdk
            Integer appCompileSdk = rootProject.project(":app").android.compileSdk
            if (pluginCompileSdk != null && appCompileSdk != null && pluginCompileSdk < appCompileSdk) {
                project.logger.warn(
                        "Warning: Overriding compileSdk version in Flutter plugin: "
                                + project.name
                                + " from "
                                + pluginCompileSdk
                                + " to "
                                + appCompileSdk
                                + " to match the app module.")
                project.android {
                    compileSdk appCompileSdk
                }
            }
        }
    }
    
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
